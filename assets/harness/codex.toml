# Built-in harness manifest for the OpenAI Codex CLI. A file
# <config>/harness/codex.toml replaces it entirely.
id = "codex"
display = "Codex"
bin = "codex"

[install]
method = "script"
# The standalone installer puts the release under $CODEX_HOME/packages and
# links $HOME/.local/bin/codex to it with an absolute path, which stays
# valid because the installer container mounts the version directory at
# its in-box path.
url = "https://chatgpt.com/codex/install.sh"
args = []
# CODEX_RELEASE pins the version (install.sh [--release VERSION]); devc
# leaves it out when no version is requested.
env = { CODEX_HOME = "{dir}/home/.codex", CODEX_RELEASE = "{version}" }
exe = "home/.local/bin/codex"
needs = []
version_cmd = ["--version"]

[home]
strategy = "shared"
dir = ".codex"
env = { CODEX_HOME = "/home/dev/.codex" }
shared = []
per_box = ["app-server-daemon", "app-server-control", "ipc", "tmp"]

[auth]
method = "shared-home"
login = ["codex", "login", "--device-auth"]
status = ["codex", "login", "status"]
env = ""
secret = ""

# Codex's home is realm-shared and box-writable, and its config.toml there
# outranks the system layer /etc/codex/config.toml. What Codex lets an
# administrator enforce goes into /etc/codex/requirements.toml (allowed
# approval policies and sandbox modes, managed hooks); the remaining
# settings are also written as managed defaults (/etc/codex/
# managed_config.toml), which Codex applies over the user's configuration
# at every start. See docs/dev/LEFTOVER.md for what stays unenforced.
[baseline.settings]
path = "/etc/codex/config.toml"
format = "toml"
template = "codex-config.toml.tmpl"
also = ["/etc/codex/managed_config.toml"]

[[baseline.files]]
path = "/etc/codex/requirements.toml"
format = "toml"
template = "codex-requirements.toml.tmpl"

[env]

[launch]
args = []
resume = ["resume", "{id}"]

[status]
osc7501 = true

[hooks]
kind = "codex"

[input]
adapter = "paste"
submit_key = "Tab"

[memory]
kind = ""

[transcripts]
globs = ["sessions/**/rollout-*.jsonl*"]
