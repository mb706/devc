# Built-in harness manifest for the OpenAI Codex CLI. A file
# <config>/harness/codex.toml replaces it entirely.
id = "codex"
display = "Codex"
bin = "codex"

[install]
method = "script"
# The standalone installer puts the release under $CODEX_HOME/packages and
# links $HOME/.local/bin/codex to it with an absolute path, which stays
# valid because the installer container mounts the version directory at
# its in-box path.
url = "https://chatgpt.com/codex/install.sh"
args = []
env = { CODEX_HOME = "{dir}/home/.codex" }
exe = "home/.local/bin/codex"
needs = []
version_cmd = ["--version"]

[home]
strategy = "shared"
dir = ".codex"
env = { CODEX_HOME = "/home/dev/.codex" }
shared = []
per_box = ["app-server-daemon", "app-server-control", "ipc", "tmp"]

[auth]
method = "shared-home"
login = ["codex", "login", "--device-auth"]
status = ["codex", "login", "status"]
env = ""
secret = ""

[baseline.settings]
# The system configuration layer: below the user's $CODEX_HOME/config.toml
# in precedence; its hooks count as managed and need no trust review.
path = "/etc/codex/config.toml"
format = "toml"
template = "codex-config.toml.tmpl"

[env]

[launch]
args = []
resume = ["resume", "{id}"]

[status]
osc7501 = true

[hooks]
kind = "codex"

[input]
adapter = "paste"
submit_key = "Tab"

[memory]
kind = ""

[transcripts]
globs = ["sessions/**/rollout-*.jsonl*"]
