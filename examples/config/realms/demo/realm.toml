description = "Demonstration realm"

[git]
user_name = "Demo User"
user_email = "demo@example.org"
branch_prefix = "agent/"       # prefix for task branches

[network]
default = "internet"           # none | allowlist | internet | open

[selinux]
level = ""                     # for example "s0:c100,c200"; only used on SELinux hosts

[harness.claude]               # per-harness overrides, keyed by harness id
auth = ""                      # overrides the manifest's auth method
secret = ""                    # overrides the secret name

[sync]
hub = true
