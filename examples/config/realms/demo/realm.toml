description = "Demonstration realm"
shares = []                    # shares mounted into every box of the realm (devc share publish); projects add their own

[git]
user_name = "Demo User"
user_email = "demo@example.org"
branch_prefix = "agent/"       # prefix for task branches

[network]
# none | allowlist | internet | open. internet, the default, reaches the
# internet but not the LAN, the host or other private addresses; allowlist
# reaches only the names below, through a proxy run by the devc daemon
# (without the daemon the box has no network); open is the engine's
# unrestricted network.
default = "internet"

[network.allowlist]            # used by boxes of level allowlist; projects add to it
presets = []                   # built-in lists: anthropic, openai, github, pypi, npm, cran, debian
domains = []                   # "example.org", "*.example.org", "git.example.org:8443";
                               # without a port, 80 and 443 are allowed

[selinux]
level = ""                     # for example "s0:c100,c200"; only used on SELinux hosts

[harness.claude]               # per-harness overrides, keyed by harness id
auth = ""                      # overrides the manifest's auth method
secret = ""                    # overrides the secret name

[sync]
hub = true

# A GitHub App you own, for projects with grants.github = "app" (see the guide).
# [github.app]
# app_id = 123456              # the App's numeric ID
# key_secret = "github-app-key" # realm secret holding the App's private key: devc secret set demo github-app-key < key.pem
# installation_id = 0          # optional; without it the installation is looked up for each repository
