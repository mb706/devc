# A project with data zones; it shows every section of project.toml.
upstream = ""                  # git URL, optional
env = "base"                   # name under envs/; exactly one of env and image, unless default_env is set
image = ""
build_from_repo = ""           # optional Containerfile path inside the repository (opt-in, image content only)
harnesses = ["claude"]
memory_group = "demo-shared"   # default: the project name
default_branch = "main"

[git]
forward = []                   # glob patterns of branches forwarded to the upstream automatically
protected = ["main"]           # relay branches the box may not update
branch_prefix = ""             # overrides the realm's
fetch_through = true           # git fetch in the box first fetches the upstream into the relay (at most once a minute)
max_push_size = "2g"           # largest pack one push from the box may send to the relay
relay_quota = "20g"            # a push that would make the relay larger is refused

[grants]
ssh = []                       # SSH host aliases reachable through the gate (devc ssh login <host>): "host" = full use of the account, "host:ro" = only [grants.ssh_allow]
secrets = []
github = "relay"               # relay | none | token:<secret-name>

[grants.ssh_allow]             # per read-only host, the commands (first words) it may run, for example cluster1 = ["squeue", "sinfo", "ls"]

[data]
root = "data"
inputs = ["raw"]               # paths relative to root
work = ["scratch"]
sealed = ["results"]

[data.savepoints]
driver = "auto"                # auto | reflink | restic | borg | none
before_session = false
keep = 10

[data.remotes.cluster1]         # devc data pull|push cluster1 [path...]
host = "cluster1"              # SSH host alias of your own ssh configuration (over 'devc ssh login cluster1' when it is open)
path = "/scratch/demo/analysis" # the remote's data root: absolute, or relative to the remote home directory
pull = ["results"]             # default paths of a pull, relative to the data root on both sides
push = ["raw"]                 # default paths of a push

[data.remotes.nas]
path = "/mnt/nas/demo/analysis" # no host: a directory on this machine (a mounted disk or NAS); absolute
push = ["results"]

[requests]
auto = ["seal", "savepoint", "note"]   # low-risk request kinds approved without asking ([] for none)

[network]
level = ""                     # overrides the realm default

[network.allowlist]            # added to the realm's list (level allowlist only)
presets = []
domains = []

[capabilities]
gpu = false
nested = false
kvm = false

[box]
memory = "8g"
pids = 0                       # 0: the global default
ports = [8888]                 # served at http://8888.analysis.demo.localhost:7480 by the daemon

[[mounts]]
project = "hello"              # another project in the same realm
mode = "ro"                    # ro | rw
