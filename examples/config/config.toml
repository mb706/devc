# Global devc settings. Every key is optional; the values shown are the
# defaults unless noted.

projects_root = "~/devc"       # where project directories live: <projects_root>/<realm>/<project>
state_dir = ""                 # empty: ~/.local/share/devc; --state-dir and DEVC_STATE_DIR win
engine = "podman"
default_env = "base"           # used by projects that set neither env nor image (default: none)
machine_name = ""              # this machine's name in the data manifest; empty: the host name

[box]
memory = "16g"
pids = 4096
shell = ""                     # empty: first of zsh, bash, sh present in the image

# Limits of the desktop sidecar (`devc gui up`), which runs beside the box in
# a cgroup of its own. "none" and -1 switch a limit off; a limit that cannot be
# applied makes `devc gui up` fail.
[gui]
memory = "2g"
pids = 512
cpus = 2

# Only used on SELinux hosts.
[selinux]
mode = "labels"                # labels: expect the file-context rule from `devc doctor`, never relabel
                               # disable: run boxes with label=disable (escape hatch; weaker isolation)

[secrets]
delivery = "files"             # files: written to each box's tmpfs /run/devc-secrets at devc up
                               # daemon: nothing is written; harnesses ask the daemon at launch

[terminal]
control = false                # true: a hub's web app may type into session terminals
                               # (the hub must allow it too); false: it only observes

[router]
listen = "127.0.0.1:7480"      # local URLs http://<port>.<project>.<realm>.localhost:7480
                               # for listed or forwarded box ports, served by the daemon;
                               # a loopback address only, or "off"

[sync]
upload_rate = "4m"             # bytes per second the daemon sends to each hub's archive
mutable_interval = "6h"        # least time between two archived generations of a changing file
                               # of shared harness state (transcripts are archived as they grow)

# Hubs this machine reports to, in order of preference (the first connected
# one sends notifications). None by default; 'devc join' adds an entry and
# stores the hub's credentials, 'devc leave' removes both.
# [[hubs]]
# url = "https://hub.example.org"
