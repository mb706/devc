<!doctype html>
<!-- The code explorer: a static app opened from disk (file://). Data files
     are classic scripts that call explorerRegister (explorer/tool/schema.go);
     nothing is fetched and no module system is used. The scripts below load
     in order: shared parts first, then the views, then the shell (main.js). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer</title>
<script>
  // The theme is applied before anything paints. Storage may be unavailable.
  (function () {
    var t = "system";
    try { t = JSON.parse(localStorage.getItem("explorer.theme") || '"system"'); } catch (e) {}
    var dark = t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
  // The registration function every data file calls.
  window.EXPLORER = { core: null, chunks: {}, docs: {}, waiting: {} };
  window.explorerRegister = function (kind, key, value) {
    if (kind === "core") { EXPLORER.core = value; return; }
    var store = kind === "chunk" ? EXPLORER.chunks : EXPLORER.docs;
    store[key] = value;
    var w = EXPLORER.waiting[kind + ":" + key] || [];
    delete EXPLORER.waiting[kind + ":" + key];
    w.forEach(function (f) { f(value); });
  };
</script>
