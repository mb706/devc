id = "trust-boundaries"
kind = "tour"
title = "Every trust boundary, most exposed first"
summary = "Every place where something crosses from a less trusted side to a more trusted one, most exposed first, with the code that checks what arrives: each boundary of the runtime map in that direction, and the attached editor, which nothing checks; what the outside sends only a box (registries, git with a token, an SSH host's or a proxied server's answers) is not a stop."
concern = "security-model"
actors = ["daemon", "relay-hooks", "cli", "helper", "context-worker", "dialer", "desktop", "hub"]

[[step]]
section = "What a box sends the host: the channel"

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.connect"
checks = ["internal/daemon.DialBoxSocket", "internal/daemon.CheckPeer", "internal/proto.HelloReply.Validate"]
text = "The daemon connects to a socket in a directory the box controls. It reaches the socket's inode without a symlink, requires the listener to be a process of the box's container, and takes the channel only when the box's hello names this project ([[flow:channel-connect]])."

[[step]]
at = "daemon"
ref = "internal/daemon.muxGuard"
text = "Every frame header the box sends is counted before yamux sees it: new streams and pings per ten seconds, streams open or half-closed. A box over a budget loses the whole channel, so it cannot grow what the daemon holds for it ([[concern:box-channel]])."

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.serveStream"
checks = ["internal/proto.ParseMessage", "internal/proto.DecodeParams"]
text = "A stream's first line must come within 30 seconds and name a method; everything after is served for the project of this channel, whatever the box writes. Requests are JSON-RPC lines of at most 1 MiB, decoded strictly; of a handler's errors only its own JSON-RPC errors reach the box with their message."

[[step]]
section = "What a box sends the host: requests and secrets"

[[step]]
at = "daemon"
ref = "internal/daemon.requestService.create"
checks = ["internal/requests.Validate"]
text = "`devc request` arrives as `host.request`: only the fields of its kind, every value matched against a pattern, budgets per project. It is stored as pending, and a high-risk kind waits for your CLI ([[flow:request-approve]], [[concern:requests-and-approval]])."

[[step]]
at = "daemon"
ref = "internal/requests.MayDecide"
text = "The one place that says who decides: the local socket anything, the project's auto list and a hub low-risk kinds only. The box channel has no decide method, so a box never approves its own request."

[[step]]
at = "daemon"
ref = "internal/daemon.Daemon.secret"
checks = ["internal/daemon.Daemon.startedWith", "internal/box.Capabilities.AllowsSecret"]
text = "With daemon delivery a box asks for a secret by name. It gets it only if its project grants it now and the capability record of its running container lists it ([[flow:secret-request]], [[concern:secrets]])."

[[step]]
section = "What a box sends the host: git"

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.serveGit"
checks = ["internal/gitx.ServeCall", "internal/daemon.Daemon.watchPush"]
text = "A push or fetch runs on the relay of the channel's project only. A push needs the box lock, free space and room in `git.relay_quota`, and a watchdog ends it when its pack would break either ([[flow:box-git-push]])."

[[step]]
at = "relay-hooks"
ref = "internal/cli.app.relayHook"
checks = ["internal/gitx.ParseHookInput", "internal/gitx.CheckPushSize", "internal/gitx.CheckUpdate", "internal/gitx.Service.RecordUpdate"]
text = "receive-pack starts devc's hooks, each a process of its own (`devc relay-hook`), with the refs the box chose. pre-receive bounds the push, update applies the branch policy and records each new tip before git applies it, so nothing the box pushes deletes or moves a record ([[concern:git-ratchet]])."

[[step]]
at = "cli"
ref = "internal/gitx.PlanBank"
checks = ["internal/gitx.Service.snapshot", "internal/gitx.Relay.Update"]
text = "A bank (`devc bank`, which the daemon too starts as a child process) takes what the box offers: the snapshot report is decoded strictly, the fetch runs git's server side in the box and writes only scratch refs, every object passes fsck, and the plan skips bad names, keeps protected branches and deletes nothing ([[flow:turn-snapshot]]). A bank has no storage budget yet ([[doc:docs/dev/LEFTOVER.md#git-x7]])."

[[step]]
section = "What a box sends the host: network and brokered access"

[[step]]
at = "cli"
ref = "internal/netpolicy.Rules"
checks = ["internal/netpolicy.Installer.Verify", "internal/box.Manager.checkNetwork"]
text = "At level internet the box has a network of its own, and every packet it sends passes devc's output chain in its namespace, installed and verified before the box starts: IPv6 is dropped, and of the host's addresses and the private ranges it reaches only its exceptions and its trusted resolvers' port 53. Level open has no rules ([[flow:network-install]], [[concern:network-levels]])."

[[step]]
at = "daemon"
ref = "internal/netpolicy.Proxy.check"
checks = ["internal/netpolicy.NormalizeHost", "internal/netpolicy.Proxy.CheckAddr", "internal/netpolicy.Proxy.watch"]
text = "At level allowlist the box has only loopback, and its connections to internet hosts are proxy requests: a bounded head, a name never an address, the allowlist of the start and of now, public IPv4 addresses checked again on the connected socket, and a watch that closes it when the permission ends ([[flow:allowlist-connect]])."
detail = "The streams of the stops around this one (host exceptions, git, SSH, GitHub, services) are not proxy requests: [[internal/daemon.boxWorker.serveStream]] hands each to a handler of its own, with its own checks, and the allowlist does not limit them."

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.serveDial"
text = "A connection to a host exception reaches only the host's loopback, and only a port an exception allows at that moment ([[concern:allowlist-proxy]])."

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.serveGate"
checks = ["internal/config.ValidHostAlias", "internal/box.Capabilities.SSHGrant", "internal/gate.Exec.Run", "internal/gate.CheckReadOnly"]
text = "An SSH connection reaches `sshd -i` that accepts only this box's key and forwards nothing; its forced command checks the grant again and runs the session over your master connection, never authenticating itself ([[flow:ssh-through-gate]], [[concern:ssh-gate]])."

[[step]]
at = "daemon"
ref = "internal/github.PlanRead"
checks = ["internal/github.ParseAPIPath", "internal/box.Capabilities.GitHubReadRepos"]
text = "A GitHub read names an operation and its fields; the daemon builds a GET of the project's repository, or one granted at the start and now, from validated parts only, and scrubs its own credential from the answer ([[flow:gh-read]], [[concern:github]])."

[[step]]
at = "daemon"
ref = "internal/daemon.Daemon.githubToken"
checks = ["internal/box.Capabilities.GitHubToken", "internal/github.Minter.verify"]
text = "In a token mode a box asks for a token; it gets one only while mode, repository and App are those of its start, and a minted token covers one verified repository and never `workflows` ([[flow:app-token]])."

[[step]]
at = "daemon"
ref = "internal/svclogin.CheckHead"
checks = ["internal/daemon.Daemon.serviceInForce", "internal/svclogin.NormalizeTarget", "internal/svclogin.Allowed"]
text = "A request to a service is checked on its raw bytes before net/http parses it: the service in force for this container, one request per connection, a normalised path a rule allows. Only then is the credential added ([[flow:service-request]], [[concern:service-logins]])."

[[step]]
section = "What a box writes where the host reads"

[[step]]
at = "daemon"
ref = "internal/session.Store.Ingest"
checks = ["internal/safefs.Root.ReadFrom", "internal/session.Store.Claim", "internal/proto.ParseSpoolLine"]
text = "Spool files are read beneath the box's runtime directory without following links, in bounded runs; the session must belong to this project, and each line is parsed strictly and re-encoded into the journal. A journal's total size has no bound yet ([[flow:event-ingestion]], [[doc:docs/dev/LEFTOVER.md#the-daemon-sessions-input-requests-x6]])."

[[step]]
at = "cli"
ref = "internal/box.Manager.verifyRunning"
checks = ["internal/netpolicy.CheckBinding", "internal/box.Manager.checkNetwork"]
text = "The readiness marker and the box's hosts file are box-writable, so they prove nothing: at level internet the host checks the binding of the rules and the table itself, and tests from outside with the canary ([[concern:network-levels]])."

[[step]]
at = "cli"
ref = "internal/session.ParseLive"
checks = ["internal/gitx.decodeStrict", "internal/gitx.Service.WorktreeList"]
text = "What in-box commands print through `podman exec` (live sessions, snapshot reports, worktree lists) is bounded, decoded with unknown fields refused and validated; a live-session report with one malformed entry changes nothing ([[concern:sessions-and-events]], [[concern:worktrees-and-context]])."
detail = "What follows the value is not always refused. [[internal/session.ParseLive]] reads only the first JSON value, so on this path `[]` followed by anything counts as an empty report and ends the box's open sessions as `lost`, as `[]` alone would. The git, data, context and archive decoders end with `Decoder.More`, which passes a stray `]` or `}` after the report; what they decoded is unaffected (`docs/dev/LEFTOVER.md` part 7)."

[[step]]
at = "cli"
ref = "internal/data.DecodeResult"
checks = ["internal/boxside.DataWorker.Run"]
text = "Data trees are walked only by workers in helper containers, one path component at a time without following links (on SELinux hosts the host also relabels the project with `restorecon -R`); the host decodes a worker's report strictly within 64 MiB and validates its paths and digests ([[concern:data-and-sealing]])."

[[step]]
at = "context-worker"
ref = "internal/boxside.ScanContext"
checks = ["internal/ctxrepo.decodeStrict"]
text = "Notes and memory are walked in the context container through safefs, and only the accepted regular files reach git, as data; git never looks at the box-written tree. The host decodes the container's report ([[concern:worktrees-and-context]])."

[[step]]
at = "daemon"
ref = "internal/boxside.DecodeArchiveListing"
checks = ["internal/fleet.Uploader.syncFile", "internal/archive.Excluded"]
text = "For the archive, shared harness state is listed by the archive worker in a helper container; the host decodes the listing strictly and opens each listed file through safefs ([[concern:fleet-archive]])."

[[step]]
section = "What a box shows you"

[[step]]
at = "cli"
ref = "internal/cli.newEditorCmd"
text = "`devc code` and `devc cursor` attach a desktop editor to the box: the editor runs its server in the box, and through it extensions, terminals and tasks act with your rights on the host. Nothing checks this crossing; it is a deliberate hole, and the command warns at every use ([[concern:host-setup]])."

[[step]]
at = "desktop"
ref = "file:assets/desktop/devc-desktop~Xvnc :1 -auth"
text = "The desktop sidecar's X server, on the loopback it shares with the box, admits a client only with the cookie, which the box holds on purpose, so anything in the box can draw, read the screen and see what you type into the viewer. VNC asks for the password, which stays in the sidecar, on the host and in the viewer's address ([[flow:gui-up]], [[concern:desktop]])."

[[step]]
at = "dialer"
ref = "internal/boxside.Dial"
checks = ["internal/netpolicy.Pin"]
text = "A forward or a local URL reaches a box's server through a dial process: the host's own devc in the user and network namespaces of the box's main process, which the host pinned and proved to be the box's, but in the host's mount namespace. It relays bytes unparsed and reads nothing of the box; a forward starts one per connection, without a bound ([[flow:local-url]], [[concern:forwards-and-local-urls]])."

[[step]]
section = "What reaches the hub without a credential"

[[step]]
at = "hub"
ref = "internal/hub.Server.listen"
checks = ["internal/hub.Server.identify"]
text = "In direct TLS a client certificate must chain to the hub's CA and be in its registry before any HTTP; behind a proxy the hub listens on loopback only and verifies the certificate the proxy passes. The registry, not the certificate, says who the client is ([[concern:hub-access]])."

[[step]]
at = "hub"
ref = "internal/hub.Server.gate"
checks = ["internal/hub.isEnrolPath", "internal/hub.Store.UseEnrolment", "internal/hub.ParseCSR"]
text = "A request without a certificate reaches only `/enroll/<token>`, and only while an enrolment token is outstanding; the token works once, within 15 minutes ([[flow:machine-join]], [[flow:device-enrol]])."

[[step]]
section = "What a machine sends the hub, and the hub your phone"

[[step]]
at = "hub"
ref = "internal/hub.cleanEvent"
checks = ["internal/hub.cleanView", "internal/hub.cleanRequest", "internal/hub.machineLink.applyEvent"]
text = "Over the machine link every row is keyed by the certificate's registry name, whatever the machine says; events, views and requests are checked and re-encoded, and the hub bounds what it holds and fetches per machine ([[concern:hub-machine-link]])."

[[step]]
at = "hub"
ref = "internal/hub.Server.apiArchivePut"
checks = ["internal/archive.ParsePath", "internal/hub.archiveStore.admit", "internal/hub.archiveStore.checkQuota"]
text = "Archive uploads land only below the machine's own name, append at the stored length, and are admitted and counted against quotas before a byte is written; the hub, not the machine, keeps classes and times ([[flow:archive-upload]], [[concern:fleet-archive]])."

[[step]]
at = "hub"
ref = "internal/hub.buildNotification"
text = "Box text reaches your phone through ntfy: the hub makes the title, the message and the button labels printable and cuts them before it posts, and a button carries a single-use token, no credential. ntfy sees every message, and over `http` the messages and the token travel without TLS ([[flow:event-to-phone]], [[concern:hub-inbox-and-notifications]])."

[[step]]
section = "What a browser sends the hub"

[[step]]
at = "hub"
ref = "internal/hub.Server.guard"
checks = ["internal/hub.Server.checkSite", "internal/hub.Server.checkSession"]
text = "Before every handler: the route's access class (device certificate, and for the API a login session made with that certificate) and its cross-site rule (`X-Devc-Request`, the hub's Origin, a JSON body for state changes) ([[flow:hub-login]])."

[[step]]
at = "hub"
ref = "internal/hub.commandParams"
checks = ["internal/hub.Server.fillRef"]
text = "A command's parameters are decoded strictly into the daemon method's own type, with the client's command ID; nothing is queued for a machine that is offline ([[flow:phone-answer]], [[concern:hub-commands-and-terminal]])."

[[step]]
at = "hub"
ref = "internal/hub.Store.UseAction"
text = "A notification button needs a device certificate and a token bound to one answer of one question, valid an hour and used once ([[concern:hub-inbox-and-notifications]])."

[[step]]
section = "What the hub sends a machine"

[[step]]
at = "daemon"
ref = "internal/daemon.Daemon.hubHandlers"
checks = ["internal/daemon.hubMethods", "internal/requests.EffectiveOrigin"]
text = "A hub may call only the allowlisted methods; decisions carry origin `hub` and so reach low-risk requests only, and terminal input needs control switched on in your config.toml as well as in hub.toml ([[concern:hub-commands-and-terminal]])."

[[step]]
at = "cli"
ref = "internal/fleet.Restorer.Restore"
checks = ["internal/archive.ParsePath", "internal/gitx.Relay.RestoreRefs"]
text = "A restore reads an archive that may be hostile: files only at accepted paths, created without following links and never replacing one; refs only in devc's namespaces, where missing, for objects that passed fsck ([[flow:state-pull]], [[concern:state-restore]])."

[[step]]
at = "cli"
ref = "internal/archive.Sealed.Validate"
checks = ["internal/archive.Sealed.Open", "internal/fleet.OpenSecrets"]
text = "A secrets bundle from the hub is bounded before it is opened (its KDF's cost, its size) and opens only for its realm; the hub chooses which bundle a pull gets ([[flow:secret-push-pull]], [[concern:secret-transfer]])."

[[step]]
section = "What other outside parties send"

[[step]]
at = "cli"
ref = "internal/gitx.Service.syncHeads"
text = "An upstream fetch lands in the upstream's own refs with every object checked; a relay branch follows only by fast-forward, recorded, so a hostile upstream cannot rewrite what the relay holds ([[flow:devc-pull]], [[concern:upstream]])."

[[step]]
at = "cli"
ref = "internal/github.Client.Call"
checks = ["internal/github.Client.checkRedirect", "internal/github.ErrorOf"]
text = "`devc pr create` and `devc pr comment` call GitHub's API with your credential: a redirect away from HTTPS is refused, an answer is read within a size limit, and GitHub's error messages are made printable and cut before you see them ([[flow:request-pr]], [[concern:github]])."

[[step]]
at = "helper"
ref = "internal/boxside.puller.merge"
checks = ["internal/data.ParseItems", "internal/boxside.CheckPullEntries"]
text = "A data pull lands in a staging directory no box can reach, and the CLI parses its preview strictly and bounded; the merge runs in the helper container, which moves what it replaces into the trash and leaves sealed entries alone ([[flow:data-pull]], [[concern:data-sync]])."

[[step]]
at = "cli"
ref = "internal/svclogin.ParseLoginOutput"
text = "A cookie service's login command runs with network in a container without capabilities that sees only a scratch directory; the host takes from its output only a JSON array of cookies with nothing after it, every cookie for the service's host and at least one not expired ([[flow:service-login]], [[concern:service-logins]])."

[[step]]
at = "cli"
ref = "internal/toolbox.Installer.Install"
text = "A harness's vendor installer runs with network in a container that sees only its new version directory and, read-only, what the harness needs; a second container without network checks that the result runs. What it installed then runs in boxes from the read-only toolbox: devc trusts the vendor's code as far as a box confines it ([[flow:harness-install]], [[concern:toolbox-and-harnesses]])."

[[step]]
at = "daemon"
ref = "internal/daemon.crossOrigin"
checks = ["internal/daemon.ParseLocalHost"]
text = "A web page in your browser can send requests to local URLs: the router refuses a state-changing method or a WebSocket from another origin and a cross-site request that is not a top-level navigation ([[flow:local-url]], [[concern:forwards-and-local-urls]])."
