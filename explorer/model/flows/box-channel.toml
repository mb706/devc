id = "box-channel"
kind = "tour"
title = "Reading the box channel"
summary = "The connection between the daemon and a box's agent, in reading order: how each side makes sure of the other, how the daemon bounds what the box can make it hold, and how requests travel in both directions."
concern = "box-channel"
actors = ["box-agent", "daemon"]

[[step]]
section = "The box listens"

[[step]]
at = "box-agent"
ref = "internal/boxside.RunAgent"
text = "Box init starts the agent once the box is ready. The agent's goroutines recover from panics and its failures are logged to `/run/devc/agent.log` and retried, so nothing it does can end box init."

[[step]]
at = "box-agent"
ref = "internal/boxside.Agent.acceptHost"
checks = ["internal/boxside.HostPeer"]
text = "The agent listens on `/run/devc/agent.sock`. A connection becomes the host's channel only when the kernel reports its peer with PID 0, a process outside the box's PID namespace, which no process in the box can be."

[[step]]
section = "The host connects"

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.channelLoop"
text = "Every running box has a worker whose channel loop connects, serves the channel until it closes, and tries again with backoff; it also records the channel's state for `devc daemon status`."

[[step]]
at = "daemon"
ref = "internal/daemon.DialBoxSocket"
text = "The socket lies in a directory the box controls. It is opened with O_PATH and O_NOFOLLOW beneath a descriptor of that directory, must be a socket, and is connected through `/proc/self/fd/<n>`, so neither a symlink nor a rename can redirect the connection."

[[step]]
at = "daemon"
ref = "internal/daemon.CheckPeer"
text = "The process that listens must belong to the box's container (its cgroup path names the container) and, when both namespaces can be read, share the PID namespace of the container's main process, whose PID comes from the engine."

[[step]]
at = "daemon"
ref = "internal/daemon.muxGuard"
text = "Between the socket and yamux sits a guard that reads every frame header: it counts the streams the box opens and the control frames it sends per time window, tracks the streams that are open or half-closed, and closes the whole connection when a budget is exceeded ([[finding:C1-03]], [[finding:C1-04]])."

[[step]]
at = "daemon"
ref = "internal/proto.HelloReply.Validate"
text = "On the control stream the daemon calls `box.hello`. The reply is decoded strictly and validated, and must name this box's realm and project and the daemon's channel protocol version; otherwise the channel is refused."

[[step]]
section = "The daemon asks"

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.call"
text = "Every request of the daemon but `box.sessions` gets a stream of its own, so a slow operation never holds up the control stream; the result is decoded strictly."

[[step]]
at = "box-agent"
ref = "internal/boxside.Agent.serveHost"
text = "The agent serves the streams the host opens with its table of handlers ([[surface:box-agent]])."

[[step]]
section = "The box asks"

[[step]]
at = "box-agent"
ref = "internal/boxside.Agent.relay"
text = "A program in the box connects to `@devc-agent`. The agent reads its first line, keeps the registration of a harness extension to itself, and relays everything else, unparsed, on a new stream to the host; without a host, a request is answered at once with \"host unavailable\"."

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.acceptStreams"
text = "The daemon accepts the box's streams; at most 96 may wait for their first line at once, and one more is closed at once. The handlers of [[surface:host-api]] are bound to the worker's project: a request is attributed to the box by the channel it arrives on, and nothing in it selects a project."

[[step]]
at = "daemon"
ref = "internal/daemon.boxWorker.serveStream"
text = "The first line must arrive within 30 seconds. `host.proxy`, `host.dial` and `host.service` become raw relays of a TCP connection, at most 64 at once. The rest share 32 places: `host.git`, `host.gate` and `host.github` take the stream over, and anything else is JSON-RPC, decoded strictly, on a stream closed after 31 minutes without input."

[[step]]
at = "daemon"
ref = "internal/proto.Conn.serve"
text = "Each request is answered from the method table; an unknown method gets an error, and a handler's error becomes \"internal error\" unless it chose a JSON-RPC error itself, which passes with its message. Ordinary errors thus never reach the box; what a JSON-RPC error says is up to its handler, and a few carry host details (a seal path outside the data root is told the host's data root)."
