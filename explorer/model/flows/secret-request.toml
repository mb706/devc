id = "secret-request"
kind = "flow"
title = "A launcher asks the daemon for a secret"
summary = "With `secrets.delivery = \"daemon\"`, a harness's launcher asks the daemon for its credential and each granted secret: the daemon checks the delivery mode, the channel's project, the grant now and at the start, reads the realm's store and answers; the value goes only into the harness's environment."
concern = "secrets"
trigger = "devc claude demo/hello, with secrets.delivery = \"daemon\" in config.toml"
actors = ["state-dir", "daemon", "launcher", "harness"]

[[step]]
section = "In the box"

[[step]]
at = "launcher"
ref = "internal/boxside.RunLaunch"
text = "The launcher runs for a session's window or for a harness's shim, with the harness's launch description read and validated ([[flow:session-launch]])."

[[step]]
at = "launcher"
ref = "internal/boxside.PrepareLaunch"
text = "The description says `delivery: daemon`: the start wrote no secret into `/run/devc-secrets`, only the SSH gate's key when the project has a grant. The secrets are added after the manifest's environment and devc's own variables."

[[step]]
at = "launcher"
ref = "internal/boxside.addDaemonSecrets"
text = "It asks for the credential of a harness that logs in with `env-token` or `api-key`, and for each granted secret whose name can be an environment variable, one request each."

[[step]]
from = "launcher"
to = "daemon"
via = "rpc:host.secret"
label = "host.secret {name}"
ref = "internal/boxside.FetchSecret"
text = "The request goes to the agent's abstract socket, which relays it unparsed on a new stream of the box channel; the launcher waits ten seconds."

[[step]]
section = "The daemon checks"

[[step]]
at = "daemon"
ref = "internal/daemon.Daemon.secret"
checks = ["internal/proto.DecodeParams", "internal/names.ValidSecret"]
text = "The handler gets the channel's project and container, never one the box names. The parameters are decoded strictly; the name must be a valid secret name. In files mode the daemon refuses and points at `/run/devc-secrets`."

[[step]]
at = "daemon"
ref = "internal/daemon.resolvedOf"
checks = ["internal/config.Config.ProblemsFor"]
text = "The project's configuration, at most three seconds old, must be free of problems."

[[step]]
at = "daemon"
ref = "internal/box.GrantedSecrets"
text = "The name must be granted now: in `grants.secrets`, or the secret of one of the project's token harnesses. A refusal is logged with the name."

[[step]]
at = "daemon"
ref = "internal/daemon.Daemon.startedWith"
checks = ["internal/box.ReadCapabilities"]
text = "The capability record must exist and belong to the running container; a box started before records existed, or whose start did not finish, is told to restart."

[[step]]
at = "daemon"
ref = "internal/box.Capabilities.AllowsSecret"
text = "The name must also be in the capability record, which holds the grants of the configuration when the start through devc that ran this container succeeded: a grant added since waits for the box's next start."

[[step]]
from = "daemon"
to = "state-dir"
via = "file"
label = "read durable/realms/<realm>/secrets/<name>"
ref = "internal/secrets.FileStore.Get"
checks = ["internal/secrets.check"]
text = "The realm's store, which no box mounts: a missing secret is answered as not found, with the command that sets it."

[[step]]
at = "daemon"
ref = "internal/secrets.readSecretFile"
text = "Opened without following a symlink; it must be a regular file of at most 64 KiB."

[[step]]
from = "daemon"
to = "launcher"
via = "reply"
label = "{value}"
ref = "internal/daemon.Daemon.secret"
text = "The value travels in the response only, back through the channel and the agent. The daemon's log says which secret it delivered to which project, never the value."

[[step]]
section = "The harness"

[[step]]
at = "launcher"
ref = "internal/boxside.FetchSecret"
text = "A trailing line ending is removed and the value becomes the variable the description names. A refusal or a missing secret prints why; an unreachable daemon makes the harness start without any of them, with one message saying how to fix it."

[[step]]
from = "launcher"
to = "harness"
via = "exec"
label = "exec the harness with the secrets in its environment"
ref = "internal/boxside.RunLaunch"
text = "The launcher replaces itself with the harness, or with the status wrapper that starts it. Nothing is written in the box. Every program the harness starts inherits the variables, and any process in the box can ask the same way while the daemon is connected (`devc box secret <name>`)."
