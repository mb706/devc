id = "secret-push-pull"
kind = "flow"
title = "Secrets from one machine to another"
summary = "devc secret push seals a realm's secrets on the first machine with a key derived from a passphrase and stores the ciphertext on the hub; devc secret pull on the second machine fetches the newest bundle, opens it with the same passphrase and adds the secrets it lacks."
concern = "secret-transfer"
trigger = "devc secret push work --to https://hub.example.org, then devc secret pull work --from https://hub.example.org on the new machine"
actors = ["user", "cli", "state-dir", "hub", "hub-archive"]

[[step]]
section = "On the first machine"

[[step]]
from = "user"
to = "cli"
via = "cmd:devc secret push"
label = "devc secret push work --to <hub>"
external = true
text = "The machine has joined the hub; the realm is configured here."

[[step]]
at = "cli"
ref = "internal/cli.app.readPassphrase"
checks = ["internal/cli.app.realmArg", "internal/cli.app.readPassphrase"]
text = "The passphrase is read from a hidden prompt, twice, or as one line of stdin when stdin is not a terminal; never from an argument. Push refuses one shorter than ten characters."

[[step]]
at = "cli"
ref = "internal/fleet.SealSecrets"
text = "Every secret the realm's store lists (`durable/realms/work/secrets/`, at most 1,000) goes into a JSON set with base64 values, the realm, this machine's name and the time; the plaintext buffer is cleared once sealed."

[[step]]
at = "cli"
ref = "internal/archive.Seal"
text = "argon2id (three passes, 64 MiB, four threads, a random 16-byte salt) gives the key; XChaCha20-Poly1305 with a random nonce seals the set, with the realm's name in the additional data."

[[step]]
from = "cli"
to = "hub"
via = "http:PUT /machine/secrets/{realm}"
label = "PUT /machine/secrets/work {format, kdf, nonce, data}"
ref = "internal/fleet.Client.PutSecrets"
text = "With the machine certificate and `X-Devc-Request: 1`."

[[step]]
at = "hub"
ref = "internal/hub.Server.apiSecretsPut"
checks = ["internal/hub.Server.identify", "internal/hub.archiveNames", "internal/hub.archiveStore.admit", "internal/archive.DecodeSealed"]
text = "One of the upload places before the body is read; then at most 520 KiB, decoded strictly and checked for shape: the hub can check nothing else, it cannot open the bundle."

[[step]]
from = "hub"
to = "hub-archive"
via = "file"
label = "secrets/<machine>/work/<n>.json"
ref = "internal/hub.archiveStore.appendNew"
checks = ["internal/hub.archiveStore.planNew", "internal/hub.archiveStore.checkQuota"]
text = "Stored with the next version number and the hub's time, counted against the machine's quotas, files and realms; that machine's versions of the realm beyond the newest ten are deleted."

[[step]]
from = "hub"
to = "cli"
via = "reply"
label = "{version}"
ref = "internal/hub.Server.apiSecretsPut"
text = "The command prints how many secrets it stored, encrypted, and the version."

[[step]]
section = "On the new machine"

[[step]]
from = "user"
to = "cli"
via = "cmd:devc secret pull"
label = "devc secret pull work --from <hub>"
external = true
text = "On the second machine, joined to the same hub, with realm `work` configured."

[[step]]
from = "cli"
to = "hub"
via = "http:GET /machine/secrets/{realm}"
label = "GET /machine/secrets/work[?machine=laptop]"
ref = "internal/fleet.Client.GetSecrets"
text = "Without `--machine` the newest bundle of the realm from any machine; with it, that machine's."

[[step]]
at = "hub"
ref = "internal/hub.Server.apiSecretsGet"
checks = ["internal/hub.archiveNames", "internal/hub.archiveStore.admit"]
text = "Reads each machine's newest version of the realm and answers with the one it stored last, by its own time."

[[step]]
from = "hub"
to = "cli"
via = "reply"
label = "{machine, version, created, sealed}"
ref = "internal/hub.Server.apiSecretsGet"
text = "The machine name, version and time are the hub's; only the sealed part is protected."

[[step]]
at = "cli"
ref = "internal/archive.Sealed.Validate"
checks = ["internal/archive.Sealed.Validate"]
text = "The bundle's shape is checked before anything is derived: the KDF parameters within bounds (at most ten passes, 1 GiB, sixteen threads), base64 of the right lengths, at most 512 KiB of ciphertext."

[[step]]
at = "cli"
ref = "internal/cli.app.readPassphrase"
text = "The passphrase, once."

[[step]]
at = "cli"
ref = "internal/archive.Sealed.Open"
text = "The key is derived with the bundle's parameters and the data opened with this realm as additional data: a wrong passphrase, another realm and damaged data give one error."

[[step]]
at = "cli"
ref = "internal/fleet.OpenSecrets"
checks = ["internal/fleet.OpenSecrets", "internal/names.ValidSecret"]
text = "The set is decoded strictly: it must name this realm and hold at most 1,000 secrets with valid names and values of one byte up to the store's limit."

[[step]]
from = "cli"
to = "state-dir"
via = "file"
label = "durable/realms/work/secrets/<name>"
ref = "internal/secrets.FileStore.Set"
text = "A secret that is missing is stored; one with the same value is counted; one with another value is kept, with a message, unless `--overwrite`."

[[step]]
from = "cli"
to = "user"
via = "reply"
label = "N added, N unchanged, N replaced, N kept"
ref = "internal/archive.SecretsReply"
text = "Also which machine's version it was and when it was stored, as the hub says."
