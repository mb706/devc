# The project's vocabulary.

[[term]]
id = "realm"
title = "Realm"
text = "A group of projects and the boundary of sharing: the boxes of a realm share harness logins and state and the package and source caches, and its projects that name the same `memory_group` share memory. Its secrets, notes, context repository and logs are kept per realm on the host; a secret reaches only the boxes of projects that are granted it. Defined by `realms/<realm>/realm.toml`; its durable state is `durable/realms/<realm>/`."
refs = ["internal/config.Realm", "internal/paths.Paths.DurableRealmDir", "internal/box.GrantedSecrets"]
see = ["project"]

[[term]]
id = "project"
title = "Project"
text = "A repository and its box, named `<realm>/<project>` ([[internal/names.ProjectRef]]). Defined by `realms/<realm>/projects/<project>/project.toml`; its directory on the host, `<projects root>/<realm>/<project>`, is mounted in its box at `/w/<realm>/<project>`."
refs = ["internal/config.Project", "internal/names.ProjectRef", "internal/paths.Paths.HostProjectDir"]
see = ["realm", "box"]

[[term]]
id = "box"
title = "Box"
aka = ["container"]
text = "A project's container, named `devc-<realm>-<project>`, created from the project's resolved configuration with a deterministic argument list. Everything in it is under the agent's control; the host treats what comes out of it as hostile input. Its short ID (the first 12 hex characters of the SHA-256 of `<realm>/<project>`) names its runtime directory."
refs = ["internal/names.BoxName", "internal/names.BoxID", "internal/box.BuildSpec"]
see = ["project", "box-agent"]

[[term]]
id = "trust-zone"
title = "Trust zone"
aka = ["zone (runtime map)"]
text = "A part of the system with one level of trust, drawn as a coloured region of the Runtime map: your devices, the hub, outside services, the host, the auxiliary containers and the box. Channels marked as trust boundaries cross from one level of trust to another, and the map shows where what arrives is checked. Not to be confused with a [[term:zone|zone of a data tree]]."
refs = ["zone:box", "zone:host"]
see = ["box"]

[[term]]
id = "harness"
title = "Harness"
aka = ["coding agent"]
text = "A coding agent devc runs in boxes (Claude Code, Codex, Cursor's CLI, OpenCode, pi), described by a manifest: how it is installed into the toolbox, where its state lives, how it logs in, how it is launched, which hooks report its events, how input reaches it."
refs = ["internal/config.Harness", "pkg:internal/harness"]
see = ["shim", "session"]

[[term]]
id = "shim"
title = "Shim"
text = "A link `/opt/devc/shims/<bin>` to the devc binary, named after a harness's binary. Started under that name inside a box, devc runs the launcher, which fetches the credential, registers a session and executes the real harness."
refs = ["cmd/devc.shim.launch", "internal/boxside.RunLaunch"]
see = ["harness", "toolbox"]

[[term]]
id = "session"
title = "Session"
text = "One run of a harness in a box, with a spool file in the box and a journal on the host: in a tmux window tagged with the session's ID when started from the host, or an ordinary process whose environment names it when started in the box. The ID is `s` and 20 lower-case base32 characters, time-ordered; devc generates it, but the launcher keeps a valid `DEVC_SESSION` it inherits, so a box can choose one."
refs = ["internal/names.NewSessionID", "internal/boxside.StartSession"]
see = ["spool", "journal"]

[[term]]
id = "spool"
title = "Spool"
text = "`/run/devc/spool/<session>.jsonl`: the file a box appends a session's events to, one JSON object per line and without `seq`. It is in the box's runtime directory on the host, which the host reads only through [[pkg:internal/safefs]]."
refs = ["internal/boxside.AppendEvents", "internal/paths.Paths.SpoolDir"]
see = ["journal", "session"]

[[term]]
id = "journal"
title = "Journal"
text = "The host's record of a session's events, `durable/realms/<realm>/journal/<project>/<session>.jsonl`: ingestion validates each spool line, gives it the next `seq` and the host's time, and appends it, within the journal budgets. No box can reach the journals; the daemon's views are rebuilt from them."
refs = ["internal/paths.Paths.JournalFile", "internal/session.Store.Ingest"]
see = ["spool", "journal-budget"]

[[term]]
id = "journal-budget"
title = "Journal budget"
aka = ["session_journal_max", "journal_quota"]
text = "What ingestion may append: a session's journal stays within `sessions.session_journal_max` (128 MiB), a project's journals within `sessions.journal_quota` (2 GiB, each journal counted in whole 4 KiB blocks plus one for its owner record), and the state file system keeps 1 GiB free. Events that do not fit stay in the spool; the host notes the stop once in the session's journal and reads the file again once there is room. `devc sessions prune` makes room by removing journals of sessions that ended."
refs = ["internal/session.room.fits", "internal/session.Store.ingestFile", "internal/session.Store.Prune"]
see = ["journal", "ingestion"]

[[term]]
id = "receipt"
title = "Receipt"
text = "What the daemon stores for a command (send, answer, interrupt, keys, start, stop, seen) under the command ID the client chose, before it acts: accepted, then delivering just before the first key, then a final outcome; `seen` acts first and stores its final receipt only after, and only when given an ID. A repeated ID returns the stored receipt and does nothing else, for as long as the receipt is kept (seven days after it became final)."
refs = ["internal/proto.Receipt", "internal/daemon.commander.submit"]
see = ["session"]

[[term]]
id = "box-agent"
title = "Box agent"
aka = ["agent"]
text = "The part of `devc box init` that connects a box to the host: it listens on `/run/devc/agent.sock` for the daemon, whose peer must lie outside the box's PID namespace, and on the abstract socket `@devc-agent` for programs in the box, whose requests it relays to the host."
refs = ["internal/boxside.RunAgent", "internal/boxside.HostPeer"]
see = ["box-channel"]

[[term]]
id = "box-channel"
title = "Box channel"
aka = ["channel"]
text = "The connection between the daemon and a box's agent. The box listens and the host connects; yamux runs over it, with JSON-RPC on its streams: the daemon's control stream (hello, live sessions), a stream for each other request of the daemon, and a stream for each client in the box. Requests from the box are attributed to it by the channel they arrive on."
refs = ["internal/daemon.boxWorker.connect", "internal/daemon.boxWorker.acceptStreams"]
see = ["box-agent"]

[[term]]
id = "relay"
title = "Relay"
aka = ["relay repository"]
text = "A bare git repository per project in the durable state (`durable/realms/<realm>/relay/<project>.git`), whose configuration and hooks devc controls. The box knows it as `origin` (`devc::<realm>/<project>`). Host git works on project code only in relays; apart from them it runs only for `devc init <url>`, which clones your configuration repository with your own git settings, and for `devc doctor`'s version check."
refs = ["internal/paths.Paths.RelayRepo", "internal/gitx.OriginURL"]
see = ["banking"]

[[term]]
id = "banking"
title = "Banking"
aka = ["bank"]
text = "Copying a running box's commits and uncommitted work into its relay: snapshot commits in the box, a bounded listing of the box's refs, a fetch by name of those the relay does not record into its incoming refs (under the push watchdog and the free-space reserve), the branch policy, records under `refs/devc/bank/`."
refs = ["internal/gitx.Service.Bank"]
see = ["relay"]

[[term]]
id = "toolbox"
title = "Toolbox"
text = "The read-only tree mounted at `/opt/devc` in every box: the devc binary, the helper container's root filesystem, the box seccomp profile, a static tmux, harness installations and their shims, built-in skills."
refs = ["pkg:internal/toolbox", "internal/paths.Paths.ToolboxDir"]
see = ["shim", "helper-container"]

[[term]]
id = "helper-container"
title = "Helper container"
text = "A throwaway container (`podman run --rm --network none`) whose root filesystem is the toolbox's helper tree behind an overlay, with only the target tree mounted and only the capabilities the job needs. Its workers do what host code must not do in box-writable trees: change owners and modes, copy, move, delete."
refs = ["internal/engine.RunOptions"]
see = ["toolbox"]

[[term]]
id = "configuration-directory"
title = "Configuration directory"
aka = ["config directory", "configuration"]
text = "`~/.config/devc`, or what `--config-dir` or `DEVC_CONFIG_DIR` name: config.toml, realms with their projects and services, envs, harness manifests, baselines, dotfiles. The only source of policy; no box can write it, and the user may keep it in git."
refs = ["internal/paths.Paths.ConfigDir", "internal/config.Load"]
see = ["state-directory", "problem"]

[[term]]
id = "state-directory"
title = "State directory"
aka = ["<state>"]
text = "`~/.local/share/devc`, or what `--state-dir`, `DEVC_STATE_DIR` or `state_dir` in config.toml name: `durable/` (state worth keeping and archiving), `local/` (this machine's), `cache/` and the toolbox. Parts of it are mounted into boxes and so box-writable."
refs = ["internal/paths.Paths.StateDir"]
see = ["runtime-directory", "toolbox"]

[[term]]
id = "runtime-directory"
title = "Runtime directory"
aka = ["<runtime>"]
text = "`$XDG_RUNTIME_DIR/devc`, or `DEVC_RUNTIME_DIR`: the daemon's socket, each box's runtime directory `<box-id>/` (mounted at /run/devc, box-writable) and its secrets directory `<box-id>-secrets/` beside it. Secrets are delivered there only when it is memory-backed, unless `DEVC_ALLOW_PERSISTENT_SECRETS=1`."
refs = ["internal/paths.Paths.RuntimeDir", "internal/paths.Paths.BoxRuntimeDir"]
see = ["state-directory", "spool"]

[[term]]
id = "projects-root"
title = "Projects root"
aka = ["projects_root"]
text = "The directory that holds the project directories, `<projects root>/<realm>/<project>`; `projects_root` in config.toml, by default `~/devc`. The root itself is the host's; everything below a project directory is box-writable."
refs = ["internal/paths.Paths.ProjectsRoot", "internal/paths.Paths.HostProjectDir"]
see = ["project"]

[[term]]
id = "env"
title = "Env"
aka = ["image recipe"]
text = "An image recipe in `envs/<env>/`: a Containerfile, built into `localhost/devc-env/<env>:latest`, or a base image named in `env.toml`. A project names an env or an image; without either it gets `default_env` from config.toml."
refs = ["internal/config.Env", "internal/paths.Paths.EnvDir"]
see = ["project"]

[[term]]
id = "manifest"
title = "Harness manifest"
aka = ["manifest", "plugin manifest"]
text = "The TOML description of a harness: installation, home and state, login, baseline, launch, hooks, input. Five are built into devc; a file `harness/<id>.toml` in the configuration directory replaces the built-in one of that id, even when it fails to load."
refs = ["internal/config.Harness", "internal/config.Config.loadHarnesses"]
see = ["harness", "baseline"]

[[term]]
id = "grant"
title = "Grant"
aka = ["grants"]
text = "What a project's box may use beyond itself, listed under `[grants]` in project.toml: realm secrets, SSH hosts (fully or with a read-only profile), a GitHub mode and repositories to read, and services of the realm."
refs = ["internal/config.Grants"]
see = ["project"]

[[term]]
id = "baseline"
title = "Baseline"
text = "The settings and instructions devc renders for a harness in every box: the user's `baseline/<id>/settings.json` (or `.toml`) with the keys the manifest's template requires merged over it, and the instructions (the generated sandbox description, then the user's and the realm's). Mounted read-only at the manifest's baseline directory."
refs = ["internal/harness.Settings", "internal/harness.Instructions", "internal/harness.BoxHooks.renderBaseline"]
see = ["manifest"]

[[term]]
id = "launch-description"
title = "Launch description"
aka = ["description"]
text = "`/etc/devc/harness/<id>.json`, written by the host for every installed harness of a box: the executable in a concrete version directory, arguments, environment, the credential's file and variable, home strategy, seeds, secrets, hooks and input settings. The in-box launcher runs a harness from it."
refs = ["internal/harness.Describe", "internal/boxside.Launch"]
see = ["shim", "harness-version"]

[[term]]
id = "home-strategy"
title = "Home strategy"
aka = ["home.strategy"]
text = "How a harness's state is kept. `private`: the home is the box's own, and only the subdirectories in `home.shared` come from realm state. `shared`: the whole harness home is the realm's, mounted into every box of the realm, with `home.per_box` subdirectories kept per box."
refs = ["internal/config.HarnessHome", "internal/harness.BoxHooks.Contribute"]
see = ["manifest", "realm"]

[[term]]
id = "harness-version"
title = "Harness version"
aka = ["version directory", "stamp"]
text = "One installation of a harness in the toolbox, `harness/<id>/v/<stamp>/`, named by its UTC time. `current` points at the latest installation that passed its check; launch descriptions name the concrete directory, so a session keeps its version, and `devc harness gc` removes versions nothing may use."
refs = ["internal/toolbox.Installer.Install", "internal/toolbox.Toolbox.GC"]
see = ["toolbox", "launch-description"]

[[term]]
id = "installer-container"
title = "Installer container"
aka = ["installer image"]
text = "A throwaway container from `localhost/devc-aux/installer`, an image devc builds from a Containerfile embedded in it. Harness installers, their checks and vendor logins run in such containers, with no new privileges, the box seccomp profile and only what the job needs mounted."
refs = ["internal/toolbox.InstallerImage", "internal/toolbox.EnsureInstallerImage"]
see = ["helper-container", "toolbox"]

[[term]]
id = "problem"
title = "Configuration problem"
aka = ["problem"]
text = "An error found while loading the configuration, with its file and key. Loading never stops at one; `devc config check` lists them all, and a box is not created, started or changed while a problem touches its project, realm, env, manifests or granted services."
refs = ["internal/config.Problem", "internal/config.Config.ProblemsFor"]
see = ["configuration-directory"]

[[term]]
id = "config-hash"
title = "Configuration hash"
aka = ["confighash", "drift", "drifted"]
text = "The SHA-256 of a box's `podman create` arguments, its image reference and ID and the seccomp profile, stored on the container as the label `devc.confighash`. When the hash `devc up` computes differs from the label, the box has drifted: `up` refuses and exits 1 until `devc up --recreate`."
refs = ["internal/box.Spec.Hash", "internal/box.ErrDrift"]
see = ["box"]

[[term]]
id = "box-lock"
title = "Box lock"
text = "An exclusive `flock` on `local/boxes/<realm>/<project>/lock` that serialises the operations on one box across devc processes: up, down, rm, starts for sh, run, root and sessions, git operations, changes of network exceptions. A second command waits up to ten minutes."
refs = ["internal/box.LockBox"]
see = ["box"]

[[term]]
id = "readiness-marker"
title = "Readiness marker"
aka = ["ready"]
text = "`/run/devc/ready`, which box init writes once the home is prepared and, at level internet, its network check passed. devc removes it before every start and polls for it after, so a marker of an earlier start never counts; any process in the box can write or remove it, so it does not prove who wrote it."
refs = ["internal/boxside.writeReady", "internal/box.Manager.afterStart"]
see = ["box-agent"]

[[term]]
id = "capability-record"
title = "Capability record"
aka = ["capabilities.json", "start record"]
text = "What a box was started with (container ID, secrets, SSH grants, network level and allowlist, GitHub grant, services), in `local/boxes/<realm>/<project>/capabilities.json`, taken from the configuration by the start through devc that ran the container; a command that finds the box running never writes it, and refuses a box without its readiness marker or without a record for its container (`internal/box.CheckStarted`). The grants the daemon or the gate hands out on demand are the intersection of this record and the current configuration.\n\nReads of the project's own GitHub repository need no record: they follow the upstream configured now. devc removes the record when it stops the box; a box stopped outside devc keeps it."
refs = ["internal/box.Capabilities", "internal/box.CapabilitiesOf"]
see = ["grant"]

[[term]]
id = "identity-fix"
title = "Identity fix"
aka = ["fix-identity"]
text = "`devc box fix-identity`, which `devc up` runs as the box's root after every start: in /etc/passwd and /etc/group the entries named `dev` or with ID 1000 become one `dev` entry with home /home/dev, those named `vault` or with ID 2000 one `vault` entry, each where its first match was; every other line stays as it was."
refs = ["internal/boxside.FixIdentity"]
see = ["vault"]

[[term]]
id = "vault"
title = "vault"
text = "The second fixed account in every box, UID and GID 2000, created by the identity fix. The data workers give it sealed data and devc's own directories in a project, so the box user, who is not their owner and has no capabilities, cannot change them."
refs = ["internal/paths.VaultUID", "internal/boxside.RewritePasswd"]
see = ["identity-fix"]

[[term]]
id = "seccomp-profile"
title = "Seccomp profile"
aka = ["seccomp.json"]
text = "The system-call filter of every box and auxiliary container, `<state>/toolbox/seccomp.json`: Podman's default profile without user-namespace creation (`clone` and `unshare` with `CLONE_NEWUSER`, `clone3`), AF_ALG sockets or `socketcall`. devc derives it from the embedded base at every toolbox sync and refuses a base of another shape."
refs = ["internal/toolbox.DeriveProfile", "internal/toolbox.Toolbox.SeccompPath"]
see = ["toolbox"]

[[term]]
id = "self-test"
title = "Self-test"
aka = ["selftest"]
text = "`devc box selftest`: run inside a box, it tries what the hardening must refuse (capabilities, user namespaces, AF_ALG, socketcall, nftables, writing the read-only mounts) and what must still work. devc never runs it by itself; the escape tests and the user do."
refs = ["internal/boxside.SelfTest"]
see = ["seccomp-profile"]

[[term]]
id = "status-wrapper"
title = "Status wrapper"
aka = ["devc box pty", "wrapper"]
text = "`devc box pty`: the launcher runs a harness whose manifest sets `status.osc7501` through it when there is a terminal. It runs the harness on a pseudo-terminal of its own, answers its OSC 7501 query, which tmux does not, and turns its status reports into state events; every other byte passes unchanged."
refs = ["internal/boxside.RunPTY", "pkg:internal/ptywrap"]
see = ["osc-7501", "session"]

[[term]]
id = "osc-7501"
title = "OSC 7501"
aka = ["Program Status Protocol", "status report"]
text = "Escape sequences `ESC ] 7501 ; … ST` in which a program reports its state (idle, working, done, blocked, error) in its own terminal output, after asking with `ESC ] 7501 ; ?` whether the terminal understands them: the Program Status Protocol."
refs = ["internal/ptywrap.ParseReport", "internal/ptywrap.Reply"]
see = ["status-wrapper"]

[[term]]
id = "pane-died-hook"
title = "Pane-died hook"
text = "The tmux hook devc sets on every session window: when the harness's process ends, the window stays (`remain-on-exit`) and tmux runs `devc box session ended`, which writes `session.end` with the exit status or signal unless the spool has one, and removes the pane."
refs = ["internal/tmux.PaneDiedHook", "internal/boxside.SessionEnded"]
see = ["session"]

[[term]]
id = "ingestion"
title = "Ingestion"
aka = ["ingest"]
text = "Copying new events from a box's spool into the journals: read through safefs from the offset reached last time, each line validated, given the session's next `seq` and the host's time, appended and synced. The daemon ingests every running box continuously; the CLI ingests when it shows or acts on sessions. Both hold the box's ingestion lock (`local/boxes/<realm>/<project>/ingest.lock`)."
refs = ["internal/session.Store.Ingest", "internal/daemon.boxWorker.ingestLoop"]
see = ["spool", "journal", "reconciliation"]

[[term]]
id = "session-owner"
title = "Session owner"
aka = ["session ownership"]
text = "The project a session ID belongs to: the first project that claimed it, which ingestion does when it first appends an event of a spool file of that ID (the host does when it first writes an event of its own); written once to `durable/session-owners/<id>`, and removed with the journal by `devc sessions prune`. A box's spool file for a session another project owns is refused before it is read, so a box cannot add events to, or receive commands for, another project's session."
refs = ["internal/session.Store.Claim", "internal/paths.Paths.SessionOwnersDir"]
see = ["session", "ingestion"]

[[term]]
id = "reconciliation"
title = "Reconciliation"
text = "Ending the sessions a journal shows open but the box no longer runs, with reason `lost` (or `box-down` after `devc down`). The box is observed under the ingestion lock after its spool was ingested, so a session started meanwhile is never ended by mistake. The daemon reconciles every 30 seconds; the CLI whenever it refreshes a box."
refs = ["internal/session.Store.Refresh", "internal/daemon.Daemon.reconcileLoop"]
see = ["ingestion", "session"]

[[term]]
id = "session-view"
title = "Session view"
aka = ["view", "summary"]
text = "What devc derives from a session's journal: harness, worktree, state, pending question, last message, turns, start and end in host time. The CLI and the daemon derive it the same way; the daemon adds the machine, the box's state and the tmux window."
refs = ["internal/proto.SessionView", "internal/proto.SessionView.Apply"]
see = ["journal", "needs-you", "turn"]

[[term]]
id = "turn"
title = "Turn"
text = "One prompt and what the harness does with it. A session view counts the prompt events (`turn`), remembers the last turn that reached done (`done_turn`) and the last one a user marked seen (`seen_turn`)."
refs = ["internal/proto.SessionView"]
see = ["needs-you", "session-view"]

[[term]]
id = "needs-you"
title = "Needs you"
text = "A live session that is blocked (a permission prompt or a question), or done with a turn nobody has marked seen. `devc ls` counts such sessions; `devc seen` marks a turn seen on every device that follows the journals."
refs = ["internal/proto.SessionView.NeedsYou", "internal/daemon.Daemon.apiSeen"]
see = ["turn", "session-view"]

[[term]]
id = "journal-follower"
title = "Journal follower"
aka = ["the daemon's hub"]
text = "The part of the daemon (type `hub` in `internal/daemon`, not the hub server) that follows every configured project's journals, whoever appends to them, keeps a view per session, wakes commands waiting for a change, and streams events to subscribers."
refs = ["internal/daemon.hub", "internal/daemon.hub.poll"]
see = ["session-view", "cursor"]

[[term]]
id = "cursor"
title = "Cursor"
text = "What a subscriber of `events.subscribe` already has: for each session, by `<realm>/<project>/<id>` (or a bare ID from older clients), the last seq it received. The daemon replays from there, so a client that reconnects misses nothing; a journal that cannot serve the cursor gets a `missed` notification."
refs = ["internal/proto.Cursor", "internal/daemon.hub.subscribe"]
see = ["journal-follower"]

[[term]]
id = "box-worker"
title = "Box worker"
text = "What the daemon keeps for one running box's container: a goroutine that holds the box channel and reconnects it, and one that ingests the spool. It is started when the box watch sees the container running and stopped when the box stops or is recreated."
refs = ["internal/daemon.boxWorker", "internal/daemon.Daemon.startWorker"]
see = ["box-channel", "ingestion"]

[[term]]
id = "control-stream"
title = "Control stream"
text = "The first yamux stream the daemon opens on a box channel: it carries `box.hello` and `box.sessions`. Every other request of the daemon, and every request from the box, gets a stream of its own."
refs = ["internal/daemon.boxWorker.connect", "internal/daemon.boxWorker.live"]
see = ["box-channel"]

[[term]]
id = "frame-inspector"
title = "Frame inspector"
aka = ["mux guard", "transport guard"]
text = "The layer between a box's socket and yamux on the daemon's side that reads every frame header and closes the channel when the box opens too many streams, sends too many pings or holds too many streams open. It bounds what yamux keeps for a box, which the application's own limits cannot."
refs = ["internal/daemon.muxGuard"]
see = ["box-channel"]

[[term]]
id = "command"
title = "Command"
aka = ["input command"]
text = "Something a client asks the daemon to do to a session: send, answer, interrupt, keys, start, stop or seen. It carries an ID the client chose, so a retry with the same ID never acts twice while its receipt is kept, and its outcome is recorded in a receipt."
refs = ["internal/proto.Command", "internal/daemon.commander"]
see = ["receipt", "at-rest", "input-gate"]

[[term]]
id = "at-rest"
title = "At rest"
text = "When a queued send may be typed into a session: idle, done or error, with a state reported after the last prompt and no question pending; a session that never reported a state counts as at rest a minute after it started."
refs = ["internal/daemon.atRest"]
see = ["command"]

[[term]]
id = "input-gate"
title = "Input gate"
text = "The daemon's wait before it types: while a tmux client showing the session's window was active in the last three seconds, until about a minute has passed. It then types even if the person is still typing; the minute is checked between `box.input.clients` calls, so it is not a hard limit."
refs = ["internal/daemon.target.gate", "internal/daemon.gateDecision"]
see = ["command"]

[[term]]
id = "input-adapter"
title = "Input adapter"
text = "How the daemon delivers a command to a harness, chosen by the manifest's `input.adapter`: `paste` (a bracketed paste and the submit key, confirmed by the prompt hook), `extension` (a message handed to devc's extension in the harness), and `mod` and `app-server`, which are not built and fall back to paste."
refs = ["internal/daemon.Adapter", "internal/daemon.adapterFor"]
see = ["command"]

[[term]]
id = "request"
title = "Request"
text = "Something a box asks the user for with `devc request`: seal, savepoint, note, package, net, grant, pr or comment. It is validated, stored in the project's request log, and carried out only after an approval, with the commands the user would run."
refs = ["internal/proto.Request", "internal/daemon.requestService.create"]
see = ["risk-class", "decision-origin"]

[[term]]
id = "risk-class"
title = "Risk class"
text = "Low (seal, savepoint, note) or high (package, net, grant, pr, comment), fixed per request kind. Low-risk requests may be approved automatically or from a hub; high-risk ones only with the CLI on the machine."
refs = ["internal/proto.RequestRisk", "internal/requests.MayDecide"]
see = ["request", "decision-origin"]

[[term]]
id = "decision-origin"
title = "Decision origin"
aka = ["origin"]
text = "Where a decision on a request came from: `local` (the daemon's socket), `auto` (the project's `[requests] auto` list) or `hub` (a hub link, or a local client that declares it). The connection decides the origin; a client can only declare a weaker one."
refs = ["internal/requests.EffectiveOrigin", "internal/requests.MayDecide"]
see = ["request", "risk-class"]

[[term]]
id = "git-ratchet"
title = "Git ratchet"
aka = ["ratchet"]
text = "The guarantee that what a relay records (every tip of its branches, every snapshot and every box tag it recorded) stays reachable whatever the box does: every tip a relay branch takes is recorded under `refs/devc/bank/`, records are only ever created, a box can delete no ref, and the relay never collects garbage.\n\nA push or a bank sees only the refs the box has at that moment, so a commit or tag the box makes and removes before either never reaches the relay."
refs = ["internal/gitx.CheckUpdate", "internal/gitx.Service.RecordUpdate", "internal/gitx.PlanBank"]
see = ["relay", "bank-ref", "banking"]

[[term]]
id = "box-repository"
title = "Box repository"
aka = [".repo"]
text = "The project's git repository in the box: the git directory `/w/<realm>/<project>/.repo`, the worktree `main/` and one sibling per task worktree. Its `origin` is `devc::<realm>/<project>`, the relay. It is box-writable, and host git never opens it: the host reaches it only through `podman exec`."
refs = ["internal/boxside.Repo", "internal/paths.InBoxRepoDir", "internal/gitx.Service.InitBox"]
see = ["relay", "task-worktree"]

[[term]]
id = "task-worktree"
title = "Task worktree"
aka = ["worktree"]
text = "A git worktree beside `main` in the project directory, `/w/<realm>/<project>/<name>`, on the branch `<branch_prefix><name>`, so that sessions can work on separate branches in one box. `devc wt new`, `devc <harness> -w <name>` and Claude Code's worktree hook create one."
refs = ["internal/boxside.Repo.AddWorktree", "internal/gitx.Service.WorktreeNew"]
see = ["box-repository"]

[[term]]
id = "pending-record"
title = "Pending record"
aka = ["pending marker", "settling a push"]
text = "A bank ref or tag record the update hook wrote for a push update git may still refuse, marked by `refs/devc/pending/<kind>/<name>/<time>` at the same object. It counts for nothing (banks, `devc push --tag` and the archive leave it out) until it is settled: confirmed when git applied the update (the marker goes), removed with its marker when git refused it. The daemon settles a push when receive-pack has ended; what is left pending is settled by the next push or bank."
refs = ["internal/gitx.PendingPrefix", "internal/gitx.Service.SettlePush", "internal/gitx.SortRefs"]
see = ["bank-ref"]

[[term]]
id = "bank-ref"
title = "Bank ref"
text = "`refs/devc/bank/<branch>/<unix time>` in a relay: created for every new tip of a relay branch by a bank, a push through the relay service, a pull or an adoption. Never moved, so a rewritten branch's old commits stay reachable. A push records the tip before git applies it, with a pending marker; when the push has ended the record is confirmed if git applied the update and removed if git refused it, the only bank ref ever deleted."
refs = ["internal/gitx.BankPrefix", "internal/gitx.PlanBank", "internal/gitx.Service.RecordUpdate", "internal/gitx.Service.SettlePush"]
see = ["git-ratchet", "banking"]

[[term]]
id = "snapshot"
title = "Snapshot"
aka = ["snapshot commit"]
text = "A commit of a worktree's uncommitted work, made in the box with a temporary index and HEAD as parent, kept as `refs/devc/wip/<worktree>` in the box repository; a bank records it in the relay as `refs/devc/snap/<worktree>/<unix time>` when it differs from the last one. Ignored files, untracked files over 10 MiB, nested repositories and special files are left out; `devc wt rm` refuses a worktree that holds any of them unless `--force`."
refs = ["internal/boxside.Repo.Snapshot", "internal/gitx.SnapPrefix"]
see = ["banking"]

[[term]]
id = "box-tip"
title = "Box tip"
text = "`refs/devc/boxtip/<branch>`: the box's own tip of a branch as the last bank or push saw it. A bank leaves a relay branch alone while the box's tip has not moved, so a fast-forward from the upstream is not taken back."
refs = ["internal/gitx.BoxTipPrefix", "internal/gitx.PlanBank"]
see = ["banking"]

[[term]]
id = "relay-service"
title = "Relay service"
text = "The daemon serving a box's `git push` and `git fetch`: a `host.git` stream from the remote helper becomes git receive-pack or upload-pack on the relay of the channel's project, with the stream as standard input and output. Pushes pass devc's relay hooks."
refs = ["internal/daemon.boxWorker.serveGit", "internal/gitx.ServeCall"]
see = ["remote-helper", "relay-hooks", "relay"]

[[term]]
id = "remote-helper"
title = "Remote helper"
aka = ["git-remote-devc"]
text = "`git-remote-devc`, which git runs in a box for `devc::` URLs. With a host connected it offers git's `connect` and relays bytes to the relay service through the agent; without one it is a stub whose push transfers nothing and says that a bank will copy the commits."
refs = ["internal/boxside.RemoteHelperMain", "internal/boxside.RemoteHelper"]
see = ["relay-service"]

[[term]]
id = "relay-hooks"
title = "Relay hooks"
text = "pre-receive, update and post-receive in `local/git/relay-hooks`, links to devc that git receive-pack runs for a box's push. pre-receive refuses a push that is too large in refs or storage, update applies the push policy and records each ref first, post-receive reports and forwards."
refs = ["internal/cli.app.relayHook", "internal/gitx.EnsureRelayHooks"]
see = ["relay-service", "bank-ref"]

[[term]]
id = "quarantine"
title = "Quarantine"
text = "The directory `objects/tmp_objdir-incoming-*` in which git receive-pack keeps a push's objects until pre-receive has accepted the push; git deletes it when pre-receive refuses. The push watchdog measures it, and the daemon removes what an ended push left there."
refs = ["internal/gitx.QuarantinePrefix", "internal/gitx.QuarantineUsage", "internal/gitx.RemoveQuarantines"]
see = ["push-watchdog"]

[[term]]
id = "push-watchdog"
title = "Push watchdog"
text = "The check every 200 ms during a box's push, and during a bank's fetch from a box: the transfer is ended when the relay would exceed `git.relay_quota` or the state file system has less than 512 MiB free."
refs = ["internal/gitx.Watch", "internal/daemon.Daemon.watchPush", "internal/daemon.Daemon.runPush", "internal/gitx.Service.fetchFromBox"]
see = ["quarantine", "held-relay"]

[[term]]
id = "held-relay"
title = "Held relay"
text = "A relay whose ended push left git processes the daemon could not end within 30 seconds: its quarantine and box lock stay, and pushes are refused, until the last process has gone."
refs = ["internal/daemon.Daemon.holdRelay", "internal/daemon.Daemon.heldRefusal"]
see = ["push-watchdog"]

[[term]]
id = "upstream"
title = "Upstream"
text = "The repository a project's `upstream` URL names (GitHub or any git host). The relay knows it as the remote `github`; the host fetches from it and pushes to it with the user's own credentials."
refs = ["internal/gitx.UpstreamRemote", "internal/gitx.Relay.SetUpstream"]
see = ["relay", "fetch-through", "forward"]

[[term]]
id = "fetch-through"
title = "Fetch-through"
text = "Before the relay service serves a box's fetch, the daemon fetches the upstream into the relay and fast-forwards relay branches, at most once a minute per project and within 20 seconds; on failure the box gets what the relay has. `git.fetch_through` turns it off."
refs = ["internal/gitx.Service.FetchThrough", "internal/daemon.Daemon.fetchThrough"]
see = ["upstream", "relay-service"]

[[term]]
id = "forward"
title = "Forward"
aka = ["forwarding"]
text = "A push of a relay branch to the upstream that devc makes on its own, after a bank or a relay-service push, for branches matching `git.forward` whose tip differs from `github/<branch>`: after a bank every such branch, after a push only those it updated. Never forced, so git refuses a non-fast-forward."
refs = ["internal/gitx.Service.forward", "internal/gitx.Matches"]
see = ["upstream"]

[[term]]
id = "protected-branch"
title = "Protected branch"
text = "A branch matching `git.protected`: a box's push to it is refused and a bank keeps the relay's tip; fast-forwards from the upstream still move it. A malformed pattern protects every branch."
refs = ["internal/gitx.Protected", "internal/gitx.CheckUpdate"]
see = ["git-ratchet"]

[[term]]
id = "context-repository"
title = "Context repository"
text = "A realm's bare repository `durable/realms/<realm>/context/.git` that versions the notes and memory boxes write (`context/notes/<project>`, `context/memory/<group>`). Only the context worker, in a container without network, runs git on it; no box sees it."
refs = ["internal/ctxrepo.Repo", "internal/boxside.ContextWorker"]
see = ["snapshot"]

[[term]]
id = "network-level"
title = "Network level"
aka = ["level"]
text = "What a box's network allows, set by a project's `network.level` or the realm's `network.default`: `none` (no network), `allowlist` (listed names through the daemon's proxy), `internet` (public IPv4 only, rules installed by the host; the default) or `open` (the engine's network as it is). The channel's services (the relay service, host exceptions, the SSH gate, GitHub, service logins) do not depend on it."
refs = ["internal/netpolicy.BoxArgs"]
see = ["allowlist-proxy", "network-binding", "network-exception"]

[[term]]
id = "network-binding"
title = "Network binding"
aka = ["binding record", "netns.json"]
text = "`/etc/devc/netns.json`, written by the host after it installed and verified the rules of level internet and before `podman start`: the network namespace's inode, the start time of the box's main process and the boot ID. Box init reports ready only if they match its own, and the host checks them again before it uses a running box."
refs = ["internal/netpolicy.Binding", "internal/netpolicy.CheckBinding", "internal/box.Manager.verifyRunning"]
see = ["sentinel", "readiness-marker"]

[[term]]
id = "sentinel"
title = "Sentinel"
text = "TCP to `192.0.2.1:9`, which devc's rules answer with a reset. Box init connects to it before it reports ready: \"connection refused\" proves the rules are loaded, since without them that address times out or is unreachable."
refs = ["internal/netpolicy.CheckSentinel", "internal/netpolicy.SentinelAddr"]
see = ["network-binding", "canary"]

[[term]]
id = "canary"
title = "Canary"
text = "The host's check from outside after a box of level internet became ready: a listener on all the host's IPv4 addresses while `devc box net-canary` tries to reach them and the host aliases from inside. A connection seen by either side fails the start."
refs = ["internal/box.Manager.checkNetwork", "internal/netpolicy.EvaluateCanary"]
see = ["sentinel"]

[[term]]
id = "trusted-resolver"
title = "Trusted resolver"
text = "A nameserver that the rules of level internet open on port 53 even at a private or host address: one the host computed from its own resolv.conf, systemd-resolved's upstream file or the network backend's inspect data. A nameserver only the box's resolv.conf names gets no exception; public addresses are open on every port anyway."
refs = ["internal/netpolicy.TrustedResolvers"]
see = ["network-level"]

[[term]]
id = "allowlist"
title = "Allowlist"
aka = ["preset"]
text = "The names a box of level allowlist may reach: `[network.allowlist]` `domains` (a name or `*.suffix`, with an optional port, else 80 and 443) and built-in `presets`, of realm and project together. It is a capability of the box's start: growing it takes effect at the box's next start, when the capability record is written again."
refs = ["internal/netpolicy.Expand", "internal/netpolicy.Presets", "internal/box.Capabilities.ProxyAllowlist"]
see = ["allowlist-proxy"]

[[term]]
id = "allowlist-proxy"
title = "Allowlist proxy"
text = "The HTTP proxy in the daemon for boxes of level allowlist: the box agent relays every connection to `127.0.0.1:3128` over the box channel; the daemon allows only listed names, resolves them itself, connects only to public IPv4 addresses and logs its decisions (not a connection refused because the box's relay places are full)."
refs = ["internal/netpolicy.Proxy", "internal/daemon.boxWorker.serveProxy"]
see = ["allowlist", "proxy-log", "network-exception"]

[[term]]
id = "network-exception"
title = "Network exception"
aka = ["exception"]
text = "A destination opened for a box for a while from the host only, by `devc net allow` (also for an approved `net` request): an address or name and port, `lan`, or `host:<port>` for a service on the host's loopback. Kept in `net-exceptions.json`, applied as timed nftables set elements at level internet, by the proxy at level allowlist, by agent listeners for `host:<port>`."
refs = ["internal/netpolicy.Exception", "internal/cli.app.netAllow", "internal/netpolicy.ExceptionScript"]
see = ["network-level", "allowlist-proxy"]

[[term]]
id = "proxy-log"
title = "Proxy log"
aka = ["netlog"]
text = "`durable/realms/<realm>/netlog/<project>.jsonl`: every decision of the allowlist proxy for the project's box, refusals and closings included; a stream refused before the proxy, because the box's relay places are full, is not in it. It moves to `.1` past 4 MiB; `devc net log` shows it."
refs = ["internal/netpolicy.NetLog"]
see = ["allowlist-proxy"]

[[term]]
id = "port-forward"
title = "Port forward"
aka = ["devc forward"]
text = "`devc forward <port>`: a listener on the host whose connections each get a dial process, the host's devc binary in the box's pinned user and network namespaces, connecting to `127.0.0.1:<port>` in the box. Works at every network level; ends when the box stops or restarts."
refs = ["internal/netpolicy.Forwarder", "internal/netpolicy.Pin", "internal/cli.app.forward"]
see = ["local-url"]

[[term]]
id = "local-url"
title = "Local URL"
aka = ["router"]
text = "`http://<port>.<project>.<realm>.localhost:7480/`, served by the daemon's router for ports in a project's `box.ports` or forwarded at the moment, through the same dial process as a port forward. From another origin the router refuses a WebSocket upgrade or a method other than GET and HEAD, and a cross-site request that is not a top-level GET navigation."
refs = ["internal/daemon.router.ServeHTTP", "internal/daemon.crossOrigin"]
see = ["port-forward"]

[[term]]
id = "ssh-gate"
title = "SSH gate"
aka = ["gate"]
text = "How a box uses a granted SSH host without a credential: its ssh connects through `devc box gate-connect` and the box channel to an `sshd -i` the daemon starts for that connection, whose forced command `devc gate-exec` runs the session over the master connection the user keeps on the host."
refs = ["internal/daemon.boxWorker.serveGate", "internal/gate.Exec.Run"]
see = ["master-connection", "gate-key", "read-only-profile", "gate-log"]

[[term]]
id = "master-connection"
title = "Master connection"
aka = ["master", "devc ssh login"]
text = "An SSH connection `devc ssh login <host>` opens on the host with the user's own keys, agent, password or second factor, and keeps in the background on a control socket in `<runtime>/gate`. Gate sessions run over it without authenticating; it ends after `--ttl` without use or with `devc ssh close`."
refs = ["internal/gate.Client.LoginCmd", "internal/gate.SocketPath"]
see = ["ssh-gate"]

[[term]]
id = "gate-key"
title = "Gate key"
aka = ["box key", "gate_key"]
text = "The key pair a box with an SSH grant gets at every start: the private half as the secret `gate_key` in `/run/devc-secrets`, the public half as `local/gate/keys/<box-id>.pub` with `restrict,pty`. It opens only the gate's sshd for that box, and only until the box's next start."
refs = ["internal/gate.Keys.NewBoxKey", "internal/gate.BoxHooks.BoxSecrets"]
see = ["ssh-gate"]

[[term]]
id = "read-only-profile"
title = "Read-only profile"
aka = [":ro"]
text = "An SSH grant written `<host>:ro`: no shell, no sftp, and only commands whose first word `[grants.ssh_allow]` lists, without shell metacharacters. A convenience, not a boundary: an allowed command that runs programs can do anything the account can."
refs = ["internal/gate.CheckReadOnly", "internal/gate.ReadOnlyNote"]
see = ["ssh-gate"]

[[term]]
id = "gate-log"
title = "Gate log"
text = "`durable/realms/<realm>/gate-log.jsonl`: one line per gate session that reached `devc gate-exec`, run or refused there, with box, host, mode, the command up to 4 KiB, exit status and duration. Never rotated. What the daemon refuses before sshd runs, and failed logins to the gate's sshd, are only in the daemon's log."
refs = ["internal/gate.AppendLog", "internal/gate.Entry"]
see = ["ssh-gate"]

[[term]]
id = "realm-secret"
title = "Realm secret"
aka = ["secret"]
text = "A value stored on the host in `durable/realms/<realm>/secrets/<name>` (0600) with `devc secret set` or `devc login`, given to the boxes of projects whose `grants.secrets` name it (and to token harnesses, and as a GitHub token where `grants.github = \"token:<name>\"`), unless it is a reserved secret. The agent can read what its box is given."
refs = ["internal/secrets.FileStore", "internal/box.GrantedSecrets"]
see = ["secret-delivery", "grant", "reserved-secret"]

[[term]]
id = "reserved-secret"
title = "Reserved secret"
text = "A realm secret no box may be given, whatever the grant: the realm's GitHub credential `github-token`, its App's private key (`github.app.key_secret`), a credential of one of its services (`value_secret`, a cookie login's secrets) and any cookie jar (`_jar.<service>`). One guard checks every name a project gives its box, in `grants.secrets`, as a harness's credential and in `grants.github = \"token:<secret>\"`, and makes a reserved one a configuration problem; a service's definition may not use the first two or a jar."
refs = ["internal/config.Config.reservedSecret", "internal/config.Config.checkBoxSecret", "internal/config.Config.checkServiceSecret"]
see = ["realm-secret", "host-github-credential", "cookie-jar"]

[[term]]
id = "secret-delivery"
title = "Secret delivery"
aka = ["delivery files", "delivery daemon"]
text = "How a box receives its secrets, `secrets.delivery` in config.toml: `files` (the default) writes them before every start into the box's secrets directory (memory-backed unless `DEVC_ALLOW_PERSISTENT_SECRETS=1`), mounted read-only at `/run/devc-secrets`; `daemon` writes no stored secret (only the SSH gate's generated key, for a box with an SSH grant) and the launcher asks the daemon with `host.secret` at each launch."
refs = ["internal/harness.BoxHooks.deliverSecrets", "internal/secrets.Deliver", "internal/daemon.Daemon.secret"]
see = ["realm-secret"]

[[term]]
id = "data-root"
title = "Data root"
aka = ["data tree", "data directory"]
text = "The directory beside `main/` in a project directory (`data` unless `[data] root` says otherwise) that holds a project's data and its zones. The box writes in it; host code never walks it (but for the SELinux relabel of the project before a start): helper-container workers do every operation on it."
refs = ["internal/data.Project", "internal/boxside.DataLayout"]
see = ["zone", "data-worker"]

[[term]]
id = "zone"
title = "Zone (data)"
aka = ["data zone", "input zone", "work zone", "sealed zone"]
text = "A directory below the data root with its own protection: an input zone is mounted read-only into the box; a work zone is the box's to change, protected only by savepoints; in a sealed zone the box creates entries that `devc seal` can hand to the vault. Zones are listed in `[data]` and may not overlap."
refs = ["internal/boxside.DataLayout.Zones", "internal/boxside.DataWorker.layoutDirs"]
see = ["data-root", "sealing"]

[[term]]
id = "sealing"
title = "Sealing"
aka = ["seal", "sealed entry"]
text = "`devc seal <path>` hands a direct child of a sealed zone to the vault and removes its write bits, recursively and without following links; from then on nothing in the box can open it for writing, move or remove it, except a regular file the box swapped for another during the seal and back, which stays writable although the seal is recorded. It protects against the box, not against you: `devc data unseal` gives it back.\n\nA descriptor opened for writing before the seal still works, and a hard-linked file is sealed under every name."
refs = ["internal/boxside.DataWorker.seal", "internal/boxside.DataWorker.ownTree"]
see = ["vault", "zone"]

[[term]]
id = "data-worker"
title = "Data worker"
text = "`devc box data-worker` in a helper container: it reads one JSON request on standard input, carries it out on the project directory mounted at `/target` (and a read-only staging directory), resolving every path without following symlinks, and prints one JSON report, which the host decodes strictly."
refs = ["internal/boxside.DataWorker", "internal/boxside.DataRequest", "internal/data.Service.work"]
see = ["helper-container", "data-root"]

[[term]]
id = "data-trash"
title = "Trash"
aka = ["data trash"]
text = "`.devc/trash/<stamp>-<label>/` in a project directory: what `devc data rm`, a pull or an in-place restore moved out of the way, by rename and with its owners, plus a `meta.json` of its paths. `devc data trash restore` puts an entry back; only `devc data trash empty` deletes."
refs = ["internal/boxside.DataWorker.newTrashEntry", "internal/boxside.TrashMeta"]
see = ["data-root"]

[[term]]
id = "savepoint"
title = "Savepoint"
text = "A copy of the data root without its input zones and sealed entries that no box can reach, taken by `devc save`, before every session (with `before_session`) or on a box's request: a vault-owned reflink copy in `.devc/savepoints/` or a restic snapshot in the state directory. `devc restore` brings it back as a copy or in place."
refs = ["internal/data.Savepoint", "internal/data.Service.Save"]
see = ["reflink-copy", "data-trash", "requested-savepoint"]

[[term]]
id = "requested-savepoint"
title = "Requested savepoint"
aka = ["requested_keep", "requested_interval"]
text = "A savepoint made on a box's request (`devc request savepoint`), recorded with the class `requested` and the request's ID. At most one is made per `data.savepoints.requested_interval` (10 minutes); only the newest `requested_keep` (10) are kept, named or not; the owner's retention (`keep`) and `before_session` never count them. Savepoints recorded before classes existed count as the owner's."
refs = ["internal/data.Service.SaveRequested", "internal/data.RequestedRetention", "internal/data.Retention"]
see = ["savepoint", "request"]

[[term]]
id = "reflink-copy"
title = "Reflink copy"
aka = ["reflink", "FICLONE"]
text = "A copy made with the `FICLONE` ioctl on filesystems that support it, such as btrfs and XFS: it shares the original's blocks until either side changes, so it is instant and costs space only as the files diverge. The savepoint driver `reflink` uses it."
refs = ["internal/boxside.DataWorker.reflinkSave", "internal/boxside.DataWorker.probeClone"]
see = ["savepoint"]

[[term]]
id = "data-link"
title = "Data link"
text = "The symlink `data -> ../<root>` in every worktree of a data project, so the agent finds the data from any worktree; made in the box as the box user, never over something that exists or that git tracks, and excluded from git status."
refs = ["internal/boxside.Repo.EnsureDataLinks"]
see = ["data-root"]

[[term]]
id = "data-remote"
title = "Data remote"
aka = ["remote"]
text = "A `[data.remotes.<name>]` of a project: an SSH host alias (or none, for a directory on this machine), the path of its data root, and default `pull` and `push` lists, all checked before they reach rsync's command line."
refs = ["internal/config.Remote", "internal/config.CheckRemote"]
see = ["sync-staging"]

[[term]]
id = "sync-staging"
title = "Staging directory (sync)"
aka = ["staging directory", "push staging"]
text = "Where rsync meets a project's data without touching the data tree: a pull fills `local/staging/<realm>/<project>/<stamp>-<remote>/` in the state directory, which a worker then merges; a push reads `.devc-staging/push-<stamp>/`, vault-owned directories of hard links a worker made."
refs = ["internal/paths.Paths.SyncStagingDir", "internal/boxside.PushStagingDir"]
see = ["data-remote", "backup-directory"]

[[term]]
id = "backup-directory"
title = "Backup directory"
aka = [".devc-backup"]
text = "`.devc-backup/<stamp>-<12 hex digits>/` below a remote's data path: where rsync keeps every file a `devc data push` replaced there, one directory per push. devc never deletes on a remote."
refs = ["internal/data.BackupDir", "internal/data.RsyncArgs"]
see = ["data-remote"]

[[term]]
id = "data-manifest"
title = "Data manifest"
text = "`durable/realms/<realm>/context/data/<project>/manifest.jsonl`: one record per entry a seal, a savepoint, a pull or a push covered, naming the machine and the entry's digest, committed with the context repository. `devc data status` and `verify` compare the data with it."
refs = ["internal/data.Record", "internal/data.AppendManifest"]
see = ["digest", "context-repository"]

[[term]]
id = "digest"
title = "Digest"
aka = ["list digest", "content hash"]
text = "`sha256:` over the type, path and size of every file and symlink of an entry, in byte order of the paths: it says which files an entry holds and how large they are, not what they contain. The content hash, with `--content`, uses each file's SHA-256 instead of its size."
refs = ["internal/boxside.Digests"]
see = ["data-manifest"]

[[term]]
id = "share"
title = "Share"
text = "A directory of a project's relay, published with `devc share publish` as a version in `durable/shares/<name>/` and mounted read-only at `/opt/shares/<name>` into every box whose project or realm lists it, in any realm. A new version is visible in running boxes at once."
refs = ["internal/shares.Service.Publish", "internal/shares.BoxHooks"]
see = ["skill"]

[[term]]
id = "skill"
title = "Skill"
text = "A share whose root holds a regular `SKILL.md`, or the built-in `dep-source`: box init links it into `~/.agents/skills/` and `~/.claude/skills/`, where harnesses look for skills."
refs = ["internal/boxside.LinkSkills", "internal/shares.SkillFile"]
see = ["share"]

[[term]]
id = "src-cache"
title = "Source cache"
aka = ["/src"]
text = "`cache/realms/<realm>/src`, mounted read-write at `/src` in every box of the realm: the dependency sources `devc src` fetched, one directory per ecosystem, name and version. Shared and writable by the realm's boxes, never pruned."
refs = ["internal/paths.Paths.RealmSrcCacheDir", "internal/depsrc.Fetch"]
see = ["realm"]

[[term]]
id = "read-facade"
title = "GitHub read facade"
aka = ["devc gh", "host.github"]
text = "The daemon's read-only access to GitHub for boxes: `devc gh` in a box names an operation, the daemon validates it, reads the project's repository (or one listed in `grants.github_read`) with the host's GitHub credential, and passes GitHub's status and body back, scrubbed. The credential never enters the box."
refs = ["internal/daemon.boxWorker.serveGitHub", "internal/github.PlanRead"]
see = ["host-github-credential", "github-token-mode"]

[[term]]
id = "host-github-credential"
title = "Host GitHub credential"
aka = ["github-token"]
text = "The user's own GitHub token on the host: the realm secret `github-token`, else what `gh auth token` prints. Only the read facade and `devc pr` use it; no box receives it: `github-token` is a reserved secret, which no grant may name."
refs = ["internal/github.HostToken"]
see = ["read-facade"]

[[term]]
id = "github-token-mode"
title = "Token mode"
aka = ["grants.github = \"app\"", "token:<secret>"]
text = "`grants.github = \"app\"` or `\"token:<secret>\"`: the box gets a GitHub token of its own, asked from the daemon by the launcher (`GH_TOKEN`) and by the box repository's credential helper for `git push github`. The default, `relay`, gives the box none."
refs = ["internal/config.Grants.GitHubTokenMode", "internal/daemon.Daemon.githubToken"]
see = ["installation-token", "git-credential-helper"]

[[term]]
id = "installation-token"
title = "Installation token"
aka = ["App token", "minted token"]
text = "A token the daemon mints with the realm's GitHub App (`[github.app]`) for one repository, by its verified ID, and the permissions granted at the box's start and now, never `workflows`. Cached until five minutes before the expiry GitHub gives it."
refs = ["internal/github.Minter.Token", "internal/github.Minter.verify"]
see = ["github-token-mode"]

[[term]]
id = "git-credential-helper"
title = "Credential helper (GitHub)"
aka = ["devc box git-credential"]
text = "`/opt/devc/bin/devc box git-credential`, which the box repository names for the GitHub host in the token modes: for `get` it asks the daemon for the token and prints it if git asked about that protocol and host; it stores nothing."
refs = ["internal/boxside.GitCredential", "internal/gitx.Service.ConfigureGitHub"]
see = ["github-token-mode"]

[[term]]
id = "service"
title = "Service"
aka = ["service login", "service.toml"]
text = "A web service a realm defines in `services/<name>/service.toml` that granted boxes reach as plain HTTP on a loopback port: the daemon checks each request against the service's rules and adds the credential, a header from a realm secret or the cookies of a login, on the way to the upstream."
refs = ["internal/config.Service", "internal/daemon.boxWorker.serveService"]
see = ["service-rule", "cookie-jar"]

[[term]]
id = "service-rule"
title = "Service rule"
aka = ["[[allow]]"]
text = "One `[[allow]]` entry of a service: methods and a path in normal form. A request passes when the first rule lists its method and its normalised path equals the rule's path or lies below it at a segment boundary; everything else gets 403 with the rule that would be needed."
refs = ["internal/config.ServiceRule", "internal/svclogin.Allowed"]
see = ["service"]

[[term]]
id = "cookie-jar"
title = "Cookie jar"
aka = ["_jar.<service>", "jar"]
text = "The cookies a cookie service's login command printed, checked strictly and stored with the time of the login as the realm secret `_jar.<service>`. The proxy sends the cookies that apply to each request. Every `_jar.` secret is reserved: no project may name it for its box, and no service's definition may use it as a credential."
refs = ["internal/svclogin.Jar", "internal/svclogin.ParseLoginOutput"]
see = ["login-container", "service"]

[[term]]
id = "login-container"
title = "Login container"
text = "The throwaway container in which `devc service login` runs a cookie service's login command: network on, no capabilities, only a scratch directory with the service's files and the login secrets mounted. Its standard output becomes the cookie jar."
refs = ["internal/svclogin.Login.Run"]
see = ["cookie-jar"]

[[term]]
id = "scrubbing"
title = "Scrubbing"
aka = ["scrub", "[redacted]"]
text = "Replacing a credential wherever it appears in what goes back to a box: the GitHub client in every body and error it passes on, the service proxy in every response header (as written and URL-encoded). Service bodies are not scrubbed."
refs = ["internal/github.Client.Scrub", "internal/svclogin.scrubber.header"]

[[term]]
id = "desktop-sidecar"
title = "Desktop sidecar"
aka = ["sidecar", "devc gui"]
text = "`devc-<realm>-<project>_gui`: a container that joins only a box's network and user namespaces and serves an X display with a VNC server and the noVNC viewer on the shared loopback interface. Started by `devc gui up`, removed before the box stops, is removed or starts."
refs = ["internal/gui.SidecarArgs", "internal/gui.Manager.Up"]
see = ["x-cookie", "viewer", "box-dependent"]

[[term]]
id = "x-cookie"
title = "X cookie"
aka = ["display.xauth", "display cookie"]
text = "The 16-byte cookie that admits an X client to the desktop: drawn for each sidecar, handed to it on standard input, and written for the box as `/run/devc/display.xauth`, readable in the box on purpose."
refs = ["internal/gui.NewSecrets", "internal/gui.Manager.writeCookie"]
see = ["desktop-sidecar"]

[[term]]
id = "viewer"
title = "Viewer"
aka = ["noVNC"]
text = "The desktop's web page, noVNC on port 6080 of the box's loopback interface, reached from the host through a detached `devc forward`. The printed address carries the VNC password after `#`, which the browser keeps to itself."
refs = ["internal/gui.Viewer.URL", "internal/cli.cliForwards.Start"]
see = ["desktop-sidecar"]

[[term]]
id = "box-dependent"
title = "Box dependent"
aka = ["dependent"]
text = "A container that joined a box's namespaces and must go before the box stops, is removed or starts again; the desktop sidecar is the only one. One that cannot be removed stops the operation."
refs = ["internal/box.Dependent", "internal/box.Manager.removeDependents"]
see = ["desktop-sidecar"]

# ----- the hub (X11)

[[term]]
id = "hub"
title = "Hub"
aka = ["hub server"]
text = "An always-on `devc hub serve` on a server that machine daemons dial out to. It mirrors the sessions of every joined machine that are live or had an event in the last 30 days, at most 20,000 per machine, derives the inbox, notifies through ntfy and serves the web app; it acts on a machine only through the methods that machine's daemon allows a hub."
refs = ["internal/hub.Server", "internal/daemon.hubMethods"]
see = ["machine-link", "projection"]

[[term]]
id = "machine-link"
title = "Machine link"
aka = ["hub link"]
text = "The WebSocket a machine's daemon keeps open to each hub in config.toml, authenticated by the machine certificate. Over it the hub calls the daemon's allowlisted methods and receives the machine's session events; the daemon calls only `hub.hello` and `hub.role`."
refs = ["internal/daemon.hubLink.connectOnce", "internal/hub.Server.serveLink"]
see = ["hub", "client-certificate"]

[[term]]
id = "hub-ca"
title = "Hub CA"
text = "The hub's own certificate authority (ECDSA P-256, ten years) in `<hub>/ca/`. It signs the machine and device certificates and the hub's default server certificate. Its key is read by the hub's commands and, to sign a machine's request at enrolment, by the server."
refs = ["internal/hub.createCA", "internal/hub.LoadCA", "internal/hub.CA.signClient"]
see = ["client-certificate", "certificate-registry"]

[[term]]
id = "client-certificate"
title = "Machine and device certificates"
aka = ["machine certificate", "device certificate", "client certificate"]
text = "One-year client certificates from the hub CA, with the name as CN and the role as OU. A machine certificate opens the machine link; a device certificate lets a browser or phone use the web app and the API. What counts is the registry's record of the certificate, not the certificate itself."
refs = ["internal/hub.CA.signClient", "internal/hub.CertRecord"]
see = ["certificate-registry", "hub-ca"]

[[term]]
id = "certificate-registry"
title = "Certificate registry"
aka = ["registry"]
text = "The `certs` table of the hub's database: every certificate the hub issued or imported, by SHA-256 fingerprint, with role, name, expiry and revocation. Every request is checked against it, and long-lived connections whenever it changes."
refs = ["internal/hub.Store.Cert", "internal/hub.CertRecord.Valid", "internal/hub.Store.Revoke"]
see = ["client-certificate"]

[[term]]
id = "enrolment-token"
title = "Enrolment token"
text = "A single-use 256-bit token from `devc hub enroll machine|device <name>`, valid at most 15 minutes and stored as its hash. While one is outstanding the hub serves `/enroll/<token>` without a client certificate: a device downloads its bundle there, a machine has its certificate request signed."
refs = ["internal/hub.CreateEnrolment", "internal/hub.Store.UseEnrolment", "internal/hub.Server.gate"]
see = ["hub-gate"]

[[term]]
id = "hub-gate"
title = "Gate (hub)"
text = "The one place where the hub handles a request without a client certificate ([[internal/hub.Server.gate]]): exactly `/enroll/<token>` goes on while an enrolment token is outstanding; everything else gets 404 and a closed connection."
refs = ["internal/hub.Server.gate", "internal/hub.isEnrolPath"]
see = ["enrolment-token", "access-class"]

[[term]]
id = "login-session"
title = "Login session"
text = "What `POST /api/login` with the hub's password (and TOTP code) creates: a 256-bit token in the cookie `__Host-devc-session`, stored as its hash and bound to the device certificate it was made with. It lasts 30 days after its last use and ends at logout, revocation, or when the cookie comes with another certificate."
refs = ["internal/hub.Server.apiLogin", "internal/hub.Server.checkSession"]
see = ["client-certificate"]

[[term]]
id = "access-class"
title = "Access class"
text = "What a hub route requires: a machine certificate, a device certificate, a device certificate with a login session, or for enrolment nothing but the token. Every route of the route table names one, and a cross-site rule; the front enforces both before the handler runs."
refs = ["internal/hub.routeTable", "internal/hub.Server.guard"]
see = ["cross-site-rule", "hub-gate"]

[[term]]
id = "cross-site-rule"
title = "Cross-site rule"
text = "A hub route's defence against requests that a page on another site makes the browser send: reads check `Origin` and `Sec-Fetch-Site` when sent; the web app's state changes need `X-Devc-Request: 1`, the hub's Origin and a JSON body; requests with a token need the header."
refs = ["internal/hub.Server.checkSite", "internal/hub.RequestHeader"]
see = ["access-class"]

[[term]]
id = "projection"
title = "Projection (hub)"
aka = ["hub projection"]
text = "The hub's copy of a machine's sessions in its database: each session's view folded to its cursor, a tail of at most 500 events and 1 MiB, the pending requests, the boxes. The sessions can be read again from the machines' journals; the boxes and the pending requests, with their parameters, come from what the machines report now (`boxes.list`, `requests.list`)."
refs = ["internal/hub.Tx.PutSession", "internal/hub.Tx.TrimTail", "internal/hub.machineLink.applyEvent"]
see = ["journal", "cursor", "machine-link"]

[[term]]
id = "change-log"
title = "Change log"
text = "The hub's table of recent changes (events, session summaries, machines, requests): the last 20,000, with consecutive IDs. Browsers' event streams and the notifier follow it and resume from an ID; an ID the log no longer reaches means starting again from a snapshot."
refs = ["internal/hub.Tx.AddChange", "internal/hub.Store.changesAfter", "internal/hub.KeepChanges"]
see = ["projection"]

[[term]]
id = "hub-resync"
title = "Re-read (hub)"
aka = ["resynchronisation"]
text = "When the hub's copy of a session cannot continue from its cursor (a gap, a session the event stream did not bring, a `missed` notice), the hub reads the session again with `sessions.get`: its view and last 500 events, holding back events that arrive meanwhile. Re-reads wait in a queue of 256 and run four at a time."
refs = ["internal/hub.machineLink.startResync", "internal/hub.machineLink.finishResync"]
see = ["projection", "cursor"]

[[term]]
id = "notifier"
title = "Notifier"
text = "The hub a machine names to send its notifications: the first connected hub in config.toml's order, told with `hub.role`. Also that hub's goroutine that follows the change log and publishes to ntfy."
refs = ["internal/daemon.hubManager.recomputeLocked", "internal/hub.notifier.run"]
see = ["notification-record"]

[[term]]
id = "notification-record"
title = "Notification record"
text = "The hub's record of one attention state of a session (needs-you with its question, failed, a finished turn): pending until published or handled without a message, sent, then cleared when the state ends (also a record still pending whose publish was attempted; one never attempted is dropped). Failures are retried with backoff, across restarts too."
refs = ["internal/hub.NoteState", "internal/hub.notifier.update"]
see = ["notifier", "action-token"]

[[term]]
id = "action-token"
title = "Action token"
aka = ["button token"]
text = "The 256-bit token behind an option button of a notification: bound to one answer of one question of one session, valid an hour, used once, sent in the `X-Devc-Action` header to `/api/act`."
refs = ["internal/hub.Server.apiAct", "internal/hub.Store.UseAction"]
see = ["notification-record"]

[[term]]
id = "inbox"
title = "Inbox"
text = "The hub's list of sessions across machines in sections: needs-you, failed, finished, working, idle. It is derived from the projection on every request and never stored."
refs = ["internal/hub.SectionOf", "internal/hub.BuildInbox"]
see = ["needs-you", "projection"]

[[term]]
id = "uncertain-outcome"
title = "Uncertain outcome"
text = "A command the hub forwarded whose answer never came back: the machine went away, did not answer in time, or sent an invalid receipt. The API says `\"uncertain\": true`, and the client asks for the receipt or retries with the same command ID."
refs = ["internal/hub.rpcStatus", "internal/hub.writeRPCError"]
see = ["receipt", "command"]

[[term]]
id = "archive"
title = "Archive"
aka = ["hub archive", "archive of durable state"]
text = "The backup of a realm's durable state that a daemon uploads to every hub it joined, for realms with `[sync] hub`: journals and logs, shared harness state, and the relays and the context repository as git bundles. Each machine writes its own tree on the hub; every enrolled machine can read all of them."
refs = ["internal/fleet.Uploader.Pass", "internal/hub.archiveStore.put", "internal/archive.ValidRel"]
see = ["archive-generation", "file-class", "retention-window", "ref-log"]

[[term]]
id = "archive-generation"
title = "Generation"
aka = ["file generation"]
text = "One version of an archived file on a hub: `files/<path>` is generation 0, `files/<path>~<n>` generation n. Bytes are only ever appended to a generation at its stored length; a file that changes other than by growing gets a new one. A generation is complete when the machine marks it so; the hub records the length and, the first time, its own time."
refs = ["internal/archive.FilePath", "internal/hub.archiveStore.putFile", "internal/hub.completionTime"]
see = ["archive", "file-class"]

[[term]]
id = "file-class"
title = "File class"
aka = ["append-only", "mutable"]
text = "How the archive treats a file. Append-only (journals, logs, transcripts): uploaded from the file itself, every generation kept. Mutable (other shared harness state): uploaded from a snapshot, at most one new generation per `[sync] mutable_interval`, older generations subject to retention. The machine proposes the class from its manifests; the hub allows mutable only in shared harness state and keeps a file's class."
refs = ["internal/archive.ClassOf", "internal/archive.MutableAllowed", "internal/hub.recordedClass"]
see = ["archive-generation", "retention-window"]

[[term]]
id = "retention-window"
title = "Retention window"
aka = ["checkpoint", "retention"]
text = "Which generations of a mutable file a hub keeps: the newest three complete ones; for each checkpoint (the starts of the last `keep_daily` days and `keep_weekly` weeks, UTC, by the hub's clock), the newest one completed at or before it; complete ones without a recorded time; and incomplete ones newer than the newest complete one. The others are dropped when a generation of the file first completes.\n\nWhile a time recorded for the file lies after the hub's clock (the clock stepped back), nothing is dropped."
refs = ["internal/hub.retentionDrops", "internal/hub.checkpoints", "internal/hub.archiveStore.retain"]
see = ["file-class", "archive-generation"]

[[term]]
id = "ref-log"
title = "Ref log"
aka = ["refs.jsonl", "bundle sequence"]
text = "How a repository travels in the archive: bundles numbered in sequence, each holding the objects the earlier ones lack, and `refs.jsonl`, one line per change of refs saying which refs were set or deleted and how many bundles they need. A restore replays the lines whose bundles are all present."
refs = ["internal/archive.RefLine", "internal/fleet.Uploader.syncRepo", "internal/fleet.ReplayRefs"]
see = ["archive", "relay", "context-repository"]

[[term]]
id = "archive-worker"
title = "Archive worker"
text = "`devc box archive-worker` in the helper container: it walks a realm's box-writable shared harness state without following anything and lists (or, for an export, packs) the regular files the archive may carry, leaving out credential files, links, special files, odd names and files above the size cap."
refs = ["internal/boxside.ArchiveWorker.Run", "internal/fleet.ContainerWorkers.ListHarness"]
see = ["helper-container", "archive"]

[[term]]
id = "secrets-bundle"
title = "Secrets bundle"
text = "A realm's secrets sealed on a machine for `devc secret push`: a key derived from a passphrase with argon2id, XChaCha20-Poly1305 with the realm as additional data. The hub stores the ten newest of each machine and realm and cannot read them; `devc secret pull` opens one on another machine."
refs = ["internal/archive.Sealed", "internal/archive.Seal", "internal/fleet.OpenSecrets"]
see = ["realm-secret"]

[[term]]
id = "state-export"
title = "State export"
text = "One tar file with a realm's durable state in the archive's layout (`devc state export`): the current files, one full bundle and a one-line ref log per repository, no secrets and no credential files. `devc state import` restores it like a hub's archive."
refs = ["internal/fleet.Exporter.Export", "internal/fleet.ReadExport"]
see = ["archive"]

[[term]]
id = "event-stream"
title = "Event stream"
text = "`GET /api/stream`: the hub's change log as server-sent events, each with its change ID. The web app keeps one open, names the sessions a screen shows, resumes from the last ID and reads its snapshot again when the hub answers `reset`."
refs = ["internal/hub.Server.apiStream", "file:web/app/stream.js~function open()"]
see = ["change-log"]

[[term]]
id = "pending-command"
title = "Pending command"
text = "In the web app, a command whose final outcome is not known: its answer was lost, or the receipt so far is not final. It keeps its ID and parameters (also in local storage) and the app asks for its receipt until one settles it, the user dismisses it or, for a prompt, a matching prompt event arrives; an uncertain `seen` is not kept. One the machine has no receipt for (never received, or its receipt dropped seven days after it became final) can be sent again with the same ID."
refs = ["file:web/app/store.js~function addPending", "file:web/app/store.js~export async function resolvePending"]
see = ["uncertain-outcome", "receipt", "outbox"]

[[term]]
id = "outbox"
title = "Outbox"
text = "Prompts sent from the web app: shown below the timeline with their state (sending, queued, typing, unknown, did not arrive) until their final receipt, or until the user dismisses one whose outcome is unknown. A prompt event that matches one is only noted beside it."
refs = ["file:web/app/store.js~export async function sendPrompt", "file:web/app/store.js~function settleOutbox"]
see = ["pending-command"]

[[term]]
id = "timeline-window"
title = "Timeline window"
text = "The at most 1,000 events the web app holds of an open session, with the entries drawn from them. Live events push the oldest out; paging back detaches the window from the live end until Back to the latest."
refs = ["file:web/app/timeline.js~export const MAX_EVENTS", "file:web/app/timeline.js~export function detach"]
see = ["event-stream"]

[[term]]
id = "content-security-policy"
title = "Content security policy"
aka = ["CSP"]
text = "The header the hub sends with every response, which the browser enforces: scripts, styles and connections from the hub's own origin only, no inline code, no eval, never framed. It is why the web app has no inline script or style and why xterm.js runs through a shim."
refs = ["internal/hub.contentSecurityPolicy", "file:web/app/cspshim.js~export function installCspShim"]
see = ["hub"]

[[term]]
id = "development-mode"
title = "Development mode"
text = "`devc hub serve --dev-no-auth`, only with `DEVC_DEV=1` and on a loopback address: the hub without certificates or login, with three invented machines that speak the machine link over pipes, for working on the web app. `web/check.sh` drives it in a headless browser."
refs = ["internal/hub.newDev", "internal/hub.Server.runDevMachines"]
see = ["hub"]
