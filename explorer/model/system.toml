# Where code runs: zones (by trust), the actors in them, and the channels
# between actors. An actor with commands or entry is devc code; a command
# stands for itself and its subcommands unless another actor names a more
# specific one.

# ----- zones
#
# The map reads from left to right as trust falls: your devices and the
# hub, the host in the middle with the auxiliary containers below it, the
# box on the right; the outside services sit above the host and the box,
# which reach them most.

[[zone]]
id = "device"
title = "Your devices"
trust = "device"
summary = "The person using devc: at a terminal on the host, in a browser, and on a phone that receives notifications."
col = 1
row = 1

[[zone]]
id = "external"
title = "Outside services"
trust = "external"
summary = "Hosts and services outside your machines: what boxes reach, and what devc reaches on your behalf."
col = 2
row = 1
colspan = 2

[[zone]]
id = "hub"
title = "Hub"
trust = "hub"
summary = "An always-on server that machines dial out to: it keeps a view of every session and an archive of durable state, notifies, and serves the web app. A machine lets it call only the methods its daemon allowlists."
col = 1
row = 2
rowspan = 2

[[zone]]
id = "host"
title = "Host"
trust = "host"
summary = "Your machine outside any box: the CLI, the daemon and the processes they start. Policy lives here (the configuration directory), and so does the state no box reaches: relays, journals, secrets, logs."
col = 2
row = 2

[[zone]]
id = "aux"
title = "Auxiliary containers"
trust = "aux"
summary = "Containers the host starts beside the boxes, each for one job and with only the mounts and capabilities that job needs: the helper, context and restic containers work on box-writable trees, the installer and login containers run vendor and login commands, the desktop sidecar serves a box's display."
col = 2
row = 3

[[zone]]
id = "box"
title = "Box"
trust = "untrusted"
summary = "A project's container, `devc-<realm>-<project>`. Everything in it is under the agent's control, devc's own helpers included: the host treats whatever comes out of it as hostile input."
col = 3
row = 2
rowspan = 2

# ----- actors: devices

[[actor]]
id = "user"
zone = "device"
title = "User"
kind = "person"
summary = "Runs devc commands in a terminal on the host, and uses the hub's web app in a browser."

[[actor]]
id = "browser"
zone = "device"
title = "Browser"
kind = "process"
summary = "Runs the hub's web app (`web/`), with a device certificate issued by the hub's CA; on the host it also opens boxes' local URLs, which the daemon's router serves."

# ----- actors: hub

[[actor]]
id = "hub"
zone = "hub"
title = "Hub server"
kind = "process"
summary = "`devc hub serve`: accepts machine links and the web app's requests, both only with client certificates from its CA (enrolment aside: [[internal/hub.Server.gate]]), keeps a projection of every session, sends notifications through ntfy, and forwards commands and terminals to machines."
commands = ["devc hub serve"]

[[actor]]
id = "hub-db"
zone = "hub"
title = "Hub database"
kind = "store"
summary = "SQLite (pure Go) in the hub directory: the certificate registry, the machines, the latest view of every session with its cursor, a bounded tail of events per session, pending requests, a change log that event streams and the notifier follow, and the access state: the password hash and TOTP secret, login sessions, enrolment, action and notification records."

[[actor]]
id = "hub-cli"
zone = "hub"
title = "Hub CLI"
kind = "process"
summary = "The `devc hub` commands run on the hub's server against the hub directory: init, the CA and its certificates, enrolment tokens, the password and TOTP, login sessions, devices and machines, the doctor, the archive's listing and pruning. They write the database while the server runs; the server notices a change of the registry within a second."
commands = ["devc hub"]

[[actor]]
id = "hub-archive"
zone = "hub"
title = "Hub archive"
kind = "store"
summary = "The archive's files in the hub directory: `archive/<machine>/<realm>/` (file generations with their records, bundles, ref logs) and `secrets/<machine>/<realm>/` (encrypted secrets bundles). Only the hub server writes them; `devc hub archive prune` deletes from `archive/` only, never secrets bundles."

# ----- actors: outside services

[[actor]]
id = "ntfy"
zone = "external"
title = "ntfy"
kind = "service"
summary = "The push notification service the hub posts to when a session needs the user."

[[actor]]
id = "vendors"
zone = "external"
title = "Vendors"
kind = "service"
summary = "Harness vendors: the sites a manifest's `install.url` names: the installer container fetches the vendor's install script from there over HTTPS and runs it; what the script downloads is the vendor's business."

[[actor]]
id = "ssh-hosts"
zone = "external"
title = "SSH hosts"
kind = "service"
summary = "Hosts a project is granted through the SSH gate; reached over the master connections `devc ssh login` keeps on the host."

[[actor]]
id = "data-remote"
zone = "external"
title = "Data remote"
kind = "service"
summary = "A `[data.remotes.<name>]` of a project: a directory on an SSH host (a cluster, a NAS) or on this machine, which `devc data pull` reads and `devc data push` writes with rsync, never deleting there."

[[actor]]
id = "service-upstream"
zone = "external"
title = "Service upstreams"
kind = "service"
summary = "The web services a realm defines in `services/<name>/service.toml` (a wiki, an internal API): the daemon's service proxy sends boxes' allowed requests there with the credential added, and a cookie service's login container logs in there."

[[actor]]
id = "github"
zone = "external"
title = "GitHub"
kind = "service"
summary = "Upstream repositories, and the REST API behind the read-only facade and GitHub App tokens ([[pkg:internal/github]])."

[[actor]]
id = "internet"
zone = "external"
title = "Internet hosts"
kind = "service"
summary = "Any host on the internet a box reaches: directly at levels internet and open, through the daemon's allowlist proxy at level allowlist."

# ----- actors: host

[[actor]]
id = "cli"
zone = "host"
title = "CLI"
kind = "process"
summary = "Every `devc` command the user runs on the host. Commands are thin: they parse arguments, call into the internal packages and print. Most read the configuration and talk to Podman or to the daemon."
commands = ["devc", "devc daemon status", "devc daemon stop", "devc hub status"]

[[actor]]
id = "config-dir"
zone = "host"
title = "Configuration directory"
kind = "store"
summary = "`~/.config/devc`: config.toml, realms, projects, services, envs, harness manifests, baselines, dotfiles. Policy comes only from here; no box can write it. Every devc command on the host reads it afresh (the CLI, gate-exec, the relay hooks), the daemon when it changes."

[[actor]]
id = "state-dir"
zone = "host"
title = "State directory"
kind = "store"
summary = "`~/.local/share/devc`: durable state (relays, journals, secrets, context, harness state) and local state (receipts, box files, archive bookkeeping), the toolbox and caches. Parts are mounted into boxes; the rest no box reaches."

[[actor]]
id = "daemon"
zone = "host"
title = "Daemon"
kind = "process"
summary = "`devc daemon`, one per machine (in the foreground, or as the systemd user service `devc service install` sets up): a channel to every running box, continuous ingestion of session events, commands with receipts, the relay service, the SSH gate, the allowlist proxy, the links to hubs, and the local API on `<runtime>/daemon.sock`."
commands = ["devc daemon"]

[[actor]]
id = "podman"
zone = "host"
title = "Podman"
kind = "service"
summary = "Rootless Podman. Every call goes through [[pkg:internal/engine]] with an argument vector; it creates and runs boxes and the auxiliary containers, and runs `podman exec` into boxes."

[[actor]]
id = "host-git"
zone = "host"
title = "git (host)"
kind = "process"
summary = "git on the host. On relays it runs only through [[internal/gitx.Host]] (hardened environment, `/` as working directory, an empty hooks directory unless the relay hooks are wanted); apart from that, `devc init` clones your configuration repository and `devc doctor` asks git's version."

[[actor]]
id = "relay-hooks"
zone = "host"
title = "Relay hooks"
kind = "process"
summary = "devc started by git receive-pack under the hook names pre-receive, update and post-receive while a box pushes to its relay; started so, it runs `devc relay-hook <name>` ([[cmd/devc.shim.relayHook]]), which checks and records the push."
commands = ["devc relay-hook"]

[[actor]]
id = "rsync"
zone = "host"
title = "rsync (host)"
kind = "process"
summary = "rsync on the host for `devc data pull` and `push`, with the argument vector of [[internal/data.RsyncArgs]] and your own SSH: it writes only a pull's staging directory below the state directory and reads only a push's vault-owned staging directory, never the data tree."

[[actor]]
id = "sshd"
zone = "host"
title = "sshd (gate)"
kind = "process"
summary = "`sshd -i` started by the daemon for each gate stream of a box, with a generated configuration: one host key, the box's key, every forwarding off, a forced command."

[[actor]]
id = "gate-exec"
zone = "host"
title = "Gate session"
kind = "process"
summary = "`devc gate-exec`, the forced command of the gate's sshd: runs one SSH session of a box over the host's master connection to a granted host."
commands = ["devc gate-exec"]

[[actor]]
id = "dialer"
zone = "host"
title = "Dial process"
kind = "process"
summary = "`devc box dial`: the host's own devc binary, started with nsenter in a box's pinned user and network namespaces but the host's mount namespace, relaying one connection of `devc forward` or the router to a port on the box's loopback."
commands = ["devc box dial"]

# ----- actors: auxiliary containers

[[actor]]
id = "installer"
zone = "aux"
title = "Installer"
kind = "process"
summary = "A throwaway container from `localhost/devc-aux/installer` (Debian with bash, curl and git) that runs a harness's vendor installer, the check of what it installed, and vendor login and status commands. It runs no devc code."

[[actor]]
id = "service-login"
zone = "aux"
title = "Login container"
kind = "process"
summary = "`devc service login` for a cookie service: a throwaway container from `auth.image` (by default the installer image) with the network on, every capability dropped and only a scratch directory mounted, which runs the service's login command and prints the cookies. It runs no devc code."

[[actor]]
id = "helper"
zone = "aux"
title = "Helper container"
kind = "process"
summary = "`podman run --rm --network none` with the toolbox's helper root filesystem and only the target tree mounted: the data layout, sealing, the trash, savepoints and restores, merging pulls and staging pushes, digests, deletions, reading shared harness state for the archive."
commands = ["devc box rm-worker", "devc box data-worker", "devc box archive-worker", "devc box statx-worker"]

[[actor]]
id = "restic"
zone = "aux"
title = "restic"
kind = "process"
summary = "The toolbox's pinned restic in a throwaway container from the helper root filesystem, as the box user without capabilities or network: it backs up a project's data root, which it sees read-only, into the restic repository of the state directory, and restores into a staging directory. It runs no devc code."

[[actor]]
id = "context-worker"
zone = "aux"
title = "Context container"
kind = "process"
summary = "A throwaway container without network that walks a realm's context directory (notes and memory, which boxes write) and commits it to the context repository ([[pkg:internal/ctxrepo]])."
commands = ["devc box context-worker"]

[[actor]]
id = "desktop"
zone = "aux"
title = "Desktop sidecar"
kind = "process"
summary = "`devc gui up`: a container from the desktop image that joins the box's network and user namespaces and serves an X display with a web viewer ([[pkg:internal/gui]]). It does not run the devc binary: Xvnc, socat, websockify and a window manager, started by the image's `devc-desktop` script."

# ----- actors: box

[[actor]]
id = "box-agent"
zone = "box"
title = "Box agent"
kind = "process"
summary = "`devc box init`, the container's main process: prepares the home, then runs the agent, which listens on `/run/devc/agent.sock` for the daemon and on the abstract socket `@devc-agent` for clients in the box, relays those to the host, and carries out the daemon's input to session panes."
commands = ["devc box init"]

[[actor]]
id = "hook"
zone = "box"
title = "Hook receiver"
kind = "process"
summary = "`devc box hook <kind> <event>`, run by the harness's hooks: maps the hook's JSON input to events and appends them to the session's spool file. It never fails and never prints, except an answer to a question."
commands = ["devc box hook"]

[[actor]]
id = "box-tools"
zone = "box"
title = "In-box commands"
kind = "process"
summary = "The other `devc box …` commands, run in the box by the host through `podman exec` (session start and stop, snapshots, worktrees, the repository report) or by programs in the box (requests and secrets the harness asks for, `devc gh`, `devc src`), and the git remote helper for `devc::` remotes."
commands = ["devc box", "devc gh", "devc request", "devc src"]
entry = ["cmd/devc.shim.remoteHelper"]

[[actor]]
id = "tmux"
zone = "box"
title = "tmux"
kind = "process"
summary = "One tmux server per box, from the toolbox, with devc's configuration: one window per session, tagged with the session's ID. Every command line comes from [[pkg:internal/tmux]]."

[[actor]]
id = "spool"
zone = "box"
title = "Spool"
kind = "store"
summary = "`/run/devc/spool/<session>.jsonl`: the box's runtime directory, which is `<runtime>/<box-id>/` on the host. The box appends events here; the host reads them only through [[pkg:internal/safefs]]."

[[actor]]
id = "launcher"
zone = "box"
title = "Launcher"
kind = "process"
summary = "What a harness shim runs (`/opt/devc/shims/<bin>` links to devc) and what a session's tmux window starts: fetches the credential, sets the environment, registers the session, and executes the real harness."
commands = ["devc box launch"]
entry = ["cmd/devc.shim.launch"]

[[actor]]
id = "box-git"
zone = "box"
title = "git (box)"
kind = "process"
summary = "git in the box, on the box repository `/w/<realm>/<project>/.repo`: run by the harness or the user, it reaches `origin` (`devc::<realm>/<project>`) through git-remote-devc; started by the host through `podman exec`, it is the git-upload-pack or git-receive-pack end of a bank or a pull. It runs no devc code, and the box repository's hooks and configuration apply only here."

[[actor]]
id = "status-wrapper"
zone = "box"
title = "Status wrapper"
kind = "process"
summary = "`devc box pty`: runs a harness on a pseudo-terminal of its own to answer its OSC 7501 status queries, which tmux does not answer, and to take its status reports out of the output."
commands = ["devc box pty"]

[[actor]]
id = "box-program"
zone = "box"
title = "Box program"
kind = "process"
summary = "Any program in the box that is not devc's: what the harness or the user runs there, such as ssh, curl, a package manager or a web server. It runs no devc code."

[[actor]]
id = "harness"
zone = "box"
title = "Harness"
kind = "process"
summary = "The coding agent (Claude Code, Codex, Cursor's CLI, OpenCode, pi), described by a manifest: installed in the toolbox, run in a session's tmux window or, started through its shim from a shell, in that shell's terminal."

# ----- channels

[[channel]]
id = "user-cli"
from = "user"
to = "cli"
title = "Terminal"
transport = "A shell on the host."
carries = "devc commands and their output."
concerns = ["command-line"]

[[channel]]
id = "cli-config"
from = "cli"
to = "config-dir"
title = "Policy"
transport = "Regular files of at most 1 MiB each below `~/.config/devc`, loaded in one pass at every command ([[internal/config.Load]])."
carries = "config.toml, realms, projects, services, envs, harness manifests, baselines and dotfiles. devc writes there only at your command: `devc init`, `realm add`, `project add` and `adopt`, `join` and `leave`, and `devc root`'s log in the env's directory."
concerns = ["configuration"]

[[channel]]
id = "cli-state"
from = "cli"
to = "state-dir"
title = "State (CLI)"
transport = "Files below `~/.local/share/devc`, at paths from [[internal/paths.Paths]]; directories are made without following a symlink ([[internal/paths.Paths.Ensure]])."
carries = "What CLI commands keep: a box's rendered files and capability record, the journals they ingest, secrets, the toolbox, savepoint indexes, data manifests. The State view lists every entry with its writer."
concerns = ["host-foundations", "box-lifecycle", "sessions-and-events"]

[[channel]]
id = "cli-git"
from = "cli"
to = "host-git"
title = "Host git (CLI)"
transport = "git through [[internal/gitx.Host]]: an argument vector, `/` as working directory, the relay as `--git-dir`, no hooks; upstream commands with your own git configuration and credentials."
carries = "Banks, pulls, pushes to the upstream, previews, logs and diffs, adoptions, share publishing and restores of relays."
concerns = ["git-ratchet", "upstream", "shares", "state-restore"]

[[channel]]
id = "daemon-api"
from = "cli"
to = "daemon"
title = "Daemon API"
transport = "The Unix socket `<runtime>/daemon.sock` (mode 0600), JSON-RPC 2.0, one object per line."
carries = "Views of boxes and sessions, event streams, commands with receipts, decisions on requests ([[surface:daemon-api]])."
checks = ["internal/proto.DecodeParams", "internal/daemon.Client.Serves"]
concerns = ["daemon", "input-and-receipts", "requests-and-approval", "watching-sessions"]


[[channel]]
id = "daemon-config"
from = "daemon"
to = "config-dir"
title = "Policy (daemon)"
transport = "The same files, loaded again when the names, sizes or modification times of the configuration files change ([[internal/daemon.Daemon.reload]])."
carries = "The configuration the daemon acts on: which boxes are projects, what each is granted now, the hubs, the router."
concerns = ["configuration", "daemon"]

[[channel]]
id = "daemon-state"
from = "daemon"
to = "state-dir"
title = "State (daemon)"
transport = "Files below the state directory, at paths from [[internal/paths.Paths]]."
carries = "What the daemon keeps: the journals it ingests, command receipts, request logs, proxy and service logs, cookie services' login state, the archive's bookkeeping; it reads capability records and secrets there."
concerns = ["daemon", "sessions-and-events", "input-and-receipts", "requests-and-approval"]

[[channel]]
id = "box-channel"
from = "daemon"
to = "box-agent"
title = "Box channel"
transport = "The daemon connects to the agent's socket (`<runtime>/<box-id>/agent.sock`, `/run/devc/agent.sock` in the box), checks that the peer is a process of that box, and runs yamux over the connection: JSON-RPC on streams, each request on a stream of its own."
carries = "The daemon's requests to the box ([[surface:box-agent]]): hello, live sessions, input to panes, listeners for exceptions and services."
boundary = true
checks = ["internal/daemon.DialBoxSocket", "internal/daemon.CheckPeer", "internal/proto.HelloReply.Validate", "internal/proto.DecodeResult", "internal/session.ParseLive"]
concerns = ["box-channel", "box-init-and-agent", "input-and-receipts", "allowlist-proxy", "service-logins"]

[[channel]]
id = "agent-local"
from = "box-tools"
to = "box-agent"
title = "Agent socket"
transport = "The abstract socket `@devc-agent`, which only processes in the box's network namespace reach."
carries = "Requests of in-box clients to the host, one JSON-RPC message first: requests, secrets, questions, hints, GitHub reads and tokens, and git and gate streams."
concerns = ["box-init-and-agent", "ssh-gate", "secrets", "github"]

[[channel]]
id = "box-streams"
from = "box-agent"
to = "daemon"
title = "Streams from the box"
transport = "A new yamux stream of the box channel per in-box client; the agent relays its bytes without parsing them."
carries = "The box's requests to the host ([[surface:host-api]]). The daemon attributes each to the box by the channel it arrives on; nothing the box says selects a project."
boundary = true
checks = ["internal/daemon.muxGuard", "internal/proto.ParseMessage", "internal/proto.DecodeParams", "internal/requests.Validate"]
concerns = ["box-channel", "box-init-and-agent", "requests-and-approval", "sessions-and-events", "git-ratchet", "allowlist-proxy", "ssh-gate", "secrets", "github", "service-logins"]

[[channel]]
id = "spool-write"
from = "hook"
to = "spool"
title = "Spool append"
transport = "One `write` per hook call to the session's spool file, opened with O_APPEND and O_NOFOLLOW."
carries = "Session events, one JSON object per line, without seq."
concerns = ["sessions-and-events", "launching-a-harness"]

[[channel]]
id = "spool-read"
from = "spool"
to = "daemon"
title = "Ingestion"
transport = "The host reads the spool beneath the box's runtime directory through safefs: no symlinks, regular files only, from the offset reached last time."
carries = "Session events, which become journal lines with seq and the host's time."
boundary = true
checks = ["internal/proto.ParseSpoolLine", "internal/session.Store.Claim"]
concerns = ["sessions-and-events"]

[[channel]]
id = "cli-podman"
from = "cli"
to = "podman"
title = "Engine commands (CLI)"
transport = "The podman binary, run with argument vectors from `/`; JSON output parsed."
carries = "Creating, starting and stopping boxes, `podman exec` into them, throwaway containers."
concerns = ["box-lifecycle"]

[[channel]]
id = "daemon-podman"
from = "daemon"
to = "podman"
title = "Engine commands (daemon)"
transport = "The podman binary, run with argument vectors from `/`; JSON output parsed."
carries = "Which boxes run, the main PID of a box for the peer check, `podman exec` of in-box session start and stop and of the web terminal's tmux client, throwaway containers."
concerns = ["daemon", "box-channel"]

[[channel]]
id = "podman-exec"
from = "podman"
to = "box-tools"
title = "podman exec"
transport = "`podman exec` as the box user with an argument vector."
carries = "In-box commands the host runs (session start, stop and listing, snapshots, worktrees, the repository report); their output comes back to the host."
boundary = true
checks = ["internal/session.ParseLive", "internal/gitx.Service.snapshot", "internal/gitx.Service.WorktreeList", "internal/gitx.Service.repoState"]
concerns = ["box-lifecycle", "launching-a-harness", "watching-sessions", "worktrees-and-context"]

[[channel]]
id = "podman-box"
from = "podman"
to = "box-agent"
title = "Box start"
transport = "`podman create` with devc's argument vector, then `podman start`; the entrypoint `/opt/devc/bin/devc box init` runs as UID 1000 under Podman's init."
carries = "The box's definition (user namespace, no capabilities, no new privileges, seccomp profile, mounts, limits, network). Back to the host comes only the readiness marker in the runtime directory, which any process in the box can write, so it proves nothing about who wrote it."
boundary = true
checks = ["internal/box.Manager.isReady", "internal/box.Manager.verifyRunning"]
concerns = ["box-lifecycle", "isolation", "box-init-and-agent"]

[[channel]]
id = "podman-helper"
from = "podman"
to = "helper"
title = "Helper run"
transport = "`podman run --rm --network none` with the helper root filesystem as a throwaway overlay, only the target tree mounted and only the capabilities the worker needs."
carries = "One worker request (often JSON on stdin); a report back. The data worker's request is a DataRequest of at most 1 MiB, its report a DataResult the host captures and decodes within 64 MiB. The trees a worker reads are box-writable, so the host treats its report as hostile input."
boundary = true
checks = ["internal/boxside.ReadDataRequest", "internal/boxside.DataWorker.Run", "internal/data.DecodeResult"]
concerns = ["box-lifecycle", "data-and-sealing", "savepoints", "data-sync"]

[[channel]]
id = "podman-restic"
from = "podman"
to = "restic"
title = "restic run"
transport = "`podman run --rm --network none` from the helper root filesystem as the box user, every capability dropped; the project directory read-only, the repository and its cache read-write, the toolbox read-only, a tmpfs /tmp."
carries = "A restic command (init, backup, forget, prune, restore, version); its JSON summary or exit status back."
concerns = ["savepoints"]

[[channel]]
id = "cli-rsync"
from = "cli"
to = "rsync"
title = "rsync"
transport = "The rsync binary with the argument vector of [[internal/data.RsyncArgs]]; dry runs captured (at most 256 MiB), transfers on the terminal."
carries = "A dry run's listing, parsed line by line, or a transfer's progress and exit status."
checks = ["internal/data.ParseItems", "internal/data.Totals"]
concerns = ["data-sync"]

[[channel]]
id = "rsync-remote"
from = "rsync"
to = "data-remote"
title = "Data transfer"
transport = "rsync's protocol over your own ssh (through the master of `devc ssh login` when one answers), or directly for a local directory; paths protected from the remote shell."
carries = "Files of the targets: from the remote into a pull's staging directory, or from a push's staging directory to the remote, never deleting there."
boundary = true
checks = ["internal/data.ParseItems", "internal/boxside.CheckPullEntries", "internal/boxside.puller.merge"]
concerns = ["data-sync"]

[[channel]]
id = "box-registries"
from = "box-tools"
to = "internet"
title = "Registries"
transport = "HTTPS from `devc src` in the box, with the box's network: through the allowlist proxy at level allowlist."
carries = "Registry documents (CRAN's index, PyPI's and npm's JSON, GitHub's commit) and source archives."
boundary = true
checks = ["internal/depsrc.Options.download", "internal/depsrc.Options.client", "internal/depsrc.cranCurrent"]
concerns = ["dependency-sources"]

[[channel]]
id = "podman-context"
from = "podman"
to = "context-worker"
title = "Context run"
transport = "`podman run --rm --network none` from the installer image with every capability dropped, the context directory and the toolbox mounted."
carries = "A context repository operation (commit, diff, log, bundle, restore)."
boundary = true
checks = ["internal/ctxrepo.decodeStrict"]
concerns = ["worktrees-and-context"]

[[channel]]
id = "podman-installer"
from = "podman"
to = "installer"
title = "Installer run"
transport = "`podman run --rm` from the installer image with no new privileges, the box seccomp profile and `--http-proxy=false`, empty tmpfs mounts at /home, /opt and /tmp, and only what the job needs mounted."
carries = "A vendor installer with its version directory mounted read-write (network on), the check of the result (network none, read-only), or a vendor login or status command with the toolbox read-only and a temporary home."
concerns = ["toolbox-and-harnesses"]

[[channel]]
id = "installer-vendors"
from = "installer"
to = "vendors"
title = "Vendor downloads"
transport = "curl with `--proto =https --tlsv1.2` for the install script; the script's own downloads."
carries = "The vendor's install script and what it fetches; a vendor login's traffic. devc trusts the vendor's code as far as the container lets it act, and checks only that the result runs, in a second container without network."
boundary = true
checks = ["internal/toolbox.Installer.Install"]
concerns = ["toolbox-and-harnesses"]

[[channel]]
id = "agent-tmux"
from = "box-agent"
to = "tmux"
title = "Pane input"
transport = "tmux command lines with argument vectors; pasted text on tmux's standard input, never as an argument."
carries = "The daemon's input: a bracketed paste and the submit key, named keys, the list of clients watching a window."
concerns = ["input-and-receipts", "launching-a-harness"]

[[channel]]
id = "tools-tmux"
from = "box-tools"
to = "tmux"
title = "Session windows"
transport = "tmux command lines with argument vectors."
carries = "A new window per session (running the launcher), tagged with the session's ID; listing and killing windows."
concerns = ["launching-a-harness"]

[[channel]]
id = "tmux-launcher"
from = "tmux"
to = "launcher"
title = "Window command"
transport = "The window's command, `/opt/devc/bin/devc box launch <harness> -- …`."
carries = "The harness to start and its arguments."
concerns = ["launching-a-harness"]

[[channel]]
id = "launcher-harness"
from = "launcher"
to = "harness"
title = "exec"
transport = "The launcher replaces itself with the harness binary, or with the status wrapper, which then starts the harness ([[channel:launcher-wrapper]], [[channel:wrapper-harness]])."
carries = "The environment of the session (`DEVC_SESSION`), the credential, the settings."
concerns = ["launching-a-harness"]


[[channel]]
id = "launcher-wrapper"
from = "launcher"
to = "status-wrapper"
title = "Exec (wrapper)"
transport = "The launcher replaces itself with `devc box pty --argv0 <bin> -- <exe> …` when the launch description asks for OSC 7501 status, `DEVC_NO_PTY` is not 1 and it runs on a terminal ([[internal/boxside.PrepareLaunch]])."
carries = "The harness to run, its arguments and the session's environment."
concerns = ["launching-a-harness"]

[[channel]]
id = "wrapper-harness"
from = "status-wrapper"
to = "harness"
title = "Pseudo-terminal"
transport = "A pseudo-terminal of the wrapper's own, on which the harness leads a new session ([[internal/ptywrap.Run]])."
carries = "Every byte both ways unchanged, but the harness's OSC 7501 query, which the wrapper answers, and its status reports, which become state events."
concerns = ["launching-a-harness"]

[[channel]]
id = "tmux-harness"
from = "tmux"
to = "harness"
title = "Terminal"
transport = "The pseudo-terminal of the session's pane."
carries = "Keys and pasted text in; the harness's screen out."
concerns = ["sessions-and-events", "launching-a-harness"]

[[channel]]
id = "harness-hook"
from = "harness"
to = "hook"
title = "Hooks"
transport = "The harness runs `devc box hook <kind> <event>` with its hook input as JSON on standard input (at most 1 MiB is read)."
carries = "What the harness reports: session start, prompts, questions, permission prompts, the final message, the end."
concerns = ["sessions-and-events", "launching-a-harness"]

[[channel]]
id = "harness-tools"
from = "harness"
to = "box-tools"
title = "devc commands"
transport = "The harness, or a program it runs, executes devc from the toolbox: `devc request`, `devc gh`, `devc src` and `devc box` commands."
carries = "Requests, GitHub reads, dependency sources, worktree hooks; each command reaches the host, if at all, through the agent."
concerns = ["requests-and-approval", "github", "dependency-sources"]

[[channel]]
id = "hub-link"
from = "daemon"
to = "hub"
title = "Machine link"
transport = "A WebSocket the daemon dials to each hub in config.toml, over TLS with the machine certificate `devc join` stored; JSON-RPC, one object per text frame ([[pkg:internal/wsconn]])."
carries = "The hub calls the daemon's allowlisted methods (views, events, session commands, low-risk decisions, terminals); the daemon sends its session events as notifications and calls only hub.hello and hub.role ([[surface:hub-link]])."
boundary = true
checks = ["internal/daemon.Daemon.hubHandlers", "internal/hub.cleanEvent", "internal/hub.cleanView", "internal/hub.cleanRequest", "internal/hub.machineLink.listSessions"]
concerns = ["hub-machine-link", "hub-commands-and-terminal"]

[[channel]]
id = "hub-db-write"
from = "hub"
to = "hub-db"
title = "Database"
transport = "SQLite in the hub directory, writes serialised in the process ([[internal/hub.Store.Write]])."
carries = "Machines, session views and event tails, pending requests, the change log, login sessions, used tokens, notification records."
concerns = ["hub-machine-link", "hub-access"]

[[channel]]
id = "hub-cli-db"
from = "hub-cli"
to = "hub-db"
title = "Admin writes"
transport = "SQLite in the hub directory, opened by each command; its writes wait on SQLite's lock while the server runs."
carries = "Issued, imported and revoked certificates, enrolment tokens (with a device's encrypted bundle), the password hash and TOTP secret, ended login sessions."
concerns = ["hub-access"]

[[channel]]
id = "cli-hub-enrol"
from = "cli"
to = "hub"
title = "Enrolment"
transport = "HTTPS without a client certificate to `/enroll/<token>`, reachable only while an enrolment token is outstanding."
carries = "`devc join --token`'s certificate request; the signed machine certificate back."
boundary = true
checks = ["internal/hub.Server.gate", "internal/hub.Store.EnrolmentUsable", "internal/hub.ParseCSR"]
concerns = ["hub-access"]

[[channel]]
id = "web-api"
from = "browser"
to = "hub"
title = "Web API"
transport = "HTTPS with a device certificate, and for the API a login session bound to it; JSON, server-sent events, a WebSocket for the terminal. Without a certificate only `/enroll/<token>`, while an enrolment token is outstanding."
carries = "The inbox, sessions, commands, decisions, the terminal ([[surface:hub-routes]]); a device's enrolment bundle."
boundary = true
checks = ["internal/hub.Server.identify", "internal/hub.Server.gate", "internal/hub.Server.guard", "internal/hub.Server.checkSession"]
concerns = ["hub-access", "hub-commands-and-terminal", "hub-inbox-and-notifications", "web-app"]

[[channel]]
id = "user-browser"
from = "user"
to = "browser"
title = "Web app"
transport = "The browser's window."
carries = "What the user reads and does in the web app."
concerns = ["web-app"]

[[channel]]
id = "hub-ntfy"
from = "hub"
to = "ntfy"
title = "Notifications"
transport = "HTTP or HTTPS requests, as `[ntfy] url` in hub.toml says, with its bearer token when one is set; over `http` the messages and the token travel without TLS."
carries = "A short message when a session needs the user, failed or finished a turn, with action buttons that carry single-use tokens; the clearing of that message when the state ends. Its text comes from boxes and is made printable and cut before it leaves; what comes back is a status."
boundary = true
checks = ["internal/hub.buildNotification", "internal/hub.ntfyClient.do"]
concerns = ["hub-inbox-and-notifications"]

[[channel]]
id = "ntfy-phone"
from = "ntfy"
to = "user"
title = "Push"
transport = "The ntfy app on the user's phone."
carries = "The notification; a button posts to the hub's `/api/act`, which needs a device certificate; Open leads into the web app."
concerns = ["hub-inbox-and-notifications"]

[[channel]]
id = "relay-service"
from = "daemon"
to = "host-git"
title = "Relay service"
transport = "git upload-pack or receive-pack on the project's relay, with the box's host.git stream as standard input and output."
carries = "Fetches and pushes of the box's git remote helper; the project is the one the channel is bound to."
boundary = true
checks = ["internal/daemon.boxWorker.serveGit", "internal/gitx.ServeCall", "internal/daemon.Daemon.watchPush"]
concerns = ["git-ratchet"]

[[channel]]
id = "git-hooks"
from = "host-git"
to = "relay-hooks"
title = "Relay hooks"
transport = "receive-pack runs the relay's pre-receive, update and post-receive hooks, which are links to devc."
carries = "The refs a push wants to update: names and object IDs the box chose."
checks = ["internal/gitx.ParseHookInput", "internal/gitx.CheckPushSize", "internal/gitx.CheckUpdate"]
concerns = ["git-ratchet"]

[[channel]]
id = "box-transport"
from = "host-git"
to = "box-git"
title = "Box transport"
transport = "git's ext:: transport: `podman exec -i -u 1000:1000 <box> git-upload-pack|git-receive-pack /w/<realm>/<project>/.repo`, allowed for these calls only (`protocol.ext.allow`)."
carries = "A bank's fetch of the box's branches, snapshots and tags into `refs/devc/incoming/`; the push of the relay's branches, the upstream's branches and tags into the box (origin/*, github/*)."
boundary = true
checks = ["internal/gitx.Host.Cmd", "internal/gitx.PlanBank"]
concerns = ["git-ratchet", "upstream", "worktrees-and-context"]

[[channel]]
id = "box-git-helper"
from = "box-git"
to = "box-tools"
title = "Remote helper"
transport = "git starts `/opt/devc/bin/git-remote-devc` for `devc::` URLs and speaks the remote-helper protocol on its standard input and output."
carries = "`connect git-upload-pack|git-receive-pack`, after which the bytes of git's protocol pass unparsed to the host's relay service; without a host, the stub's list, fetch and push."
concerns = ["git-ratchet"]

[[channel]]
id = "github-git"
from = "host-git"
to = "github"
title = "Upstream git"
transport = "git over HTTPS or SSH with the host's own credentials."
carries = "Fetches of the upstream into the relay and pushes of relay branches (devc pull, devc push, devc pr create, forwards). Every fetched object is checked (fsck), and relay branches follow the upstream only by fast-forward."
boundary = true
checks = ["internal/gitx.Relay.Configure", "internal/gitx.Service.syncHeads"]
concerns = ["upstream", "github"]

[[channel]]
id = "github-api"
from = "daemon"
to = "github"
title = "GitHub API"
transport = "HTTPS to the REST API."
carries = "The read-only facade's GET requests for boxes, built from validated parts only, with the host's credential; the App's JWT, its installation lookup, probe and mint of installation tokens."
boundary = true
checks = ["internal/github.PlanRead", "internal/github.ParseAPIPath", "internal/github.Client.checkRedirect", "internal/github.Client.Scrub", "internal/github.Minter.verify", "internal/github.Minter.mint"]
concerns = ["github"]

[[channel]]
id = "gate-sshd"
from = "daemon"
to = "sshd"
title = "Gate stream"
transport = "`sshd -i` with a box's host.gate stream as standard input and output."
carries = "One SSH connection of a box to a granted host."
boundary = true
checks = ["internal/daemon.boxWorker.serveGate", "internal/config.ValidHostAlias", "internal/box.Capabilities.SSHGrant", "internal/gate.ServerConfig.Render"]
concerns = ["ssh-gate"]

[[channel]]
id = "sshd-gate-exec"
from = "sshd"
to = "gate-exec"
title = "Forced command"
transport = "sshd's ForceCommand, `devc … gate-exec --box <box-id> --host <host> --runtime-dir <dir>` run by the user's login shell, with the box's command in `SSH_ORIGINAL_COMMAND`."
carries = "The command the box asked to run, or an interactive shell or sftp."
checks = ["internal/gate.Exec.Run", "internal/gate.CheckReadOnly"]
concerns = ["ssh-gate"]

[[channel]]
id = "gate-ssh"
from = "gate-exec"
to = "ssh-hosts"
title = "Master connection"
transport = "`ssh -S <master> -o ControlMaster=no -o ProxyCommand=false <host>` over the connection `devc ssh login` keeps in `<runtime>/gate`; without the master it fails instead of connecting."
carries = "One SSH session, with every forwarding off. What the remote sends back goes to the box unchanged."
boundary = true
checks = ["internal/gate.Client.Check", "internal/gate.Client.ExecArgs"]
concerns = ["ssh-gate"]

[[channel]]
id = "program-gate"
from = "box-program"
to = "box-tools"
title = "ProxyCommand"
transport = "The box's ssh starts `/opt/devc/bin/devc box gate-connect <host>` for a granted host, as the generated SSH configuration says, and speaks SSH on its standard input and output."
carries = "The box's SSH connection, which gate-connect relays over a host.gate stream."
concerns = ["ssh-gate"]

[[channel]]
id = "program-proxy"
from = "box-program"
to = "box-agent"
title = "Proxy port"
transport = "TCP to `127.0.0.1:3128` in a box of level allowlist (the proxy variables point there), and to the loopback ports of host exceptions and services."
carries = "Proxy requests and relayed connections; the agent relays them unparsed on raw streams of the box channel."
concerns = ["allowlist-proxy", "service-logins"]

[[channel]]
id = "proxy-upstream"
from = "daemon"
to = "internet"
title = "Proxy upstream"
transport = "TCP from the daemon to a public IPv4 address the proxy resolved itself, checked again on the socket it connects."
carries = "A box's CONNECT tunnel or plain HTTP request to an allowed name."
boundary = true
checks = ["internal/netpolicy.Proxy.check", "internal/netpolicy.Proxy.CheckAddr", "internal/netpolicy.Proxy.watch"]
concerns = ["allowlist-proxy"]

[[channel]]
id = "box-internet"
from = "box-program"
to = "internet"
title = "Box network"
transport = "The engine's network (slirp4netns or pasta) at levels internet and open; at level internet every outgoing packet passes devc's output chain in the box's namespace."
carries = "Whatever the box sends: at level internet no IPv6, nothing to private ranges or the host but its exceptions and trusted resolvers."
boundary = true
checks = ["internal/netpolicy.Rules", "internal/box.Manager.checkNetwork"]
concerns = ["network-levels"]

[[channel]]
id = "browser-router"
from = "browser"
to = "daemon"
title = "Local URLs"
transport = "HTTP to the router on `router.listen` (default `127.0.0.1:7480`), host names `<port>.<project>.<realm>.localhost`."
carries = "Requests to a server in a box, WebSockets included."
checks = ["internal/daemon.ParseLocalHost", "internal/daemon.crossOrigin", "internal/daemon.match"]
concerns = ["forwards-and-local-urls"]

[[channel]]
id = "dialer-box"
from = "dialer"
to = "box-program"
title = "Box loopback"
transport = "TCP to `127.0.0.1:<port>` inside the box's network namespace, from the dial process."
carries = "One forwarded or routed connection, relayed unparsed. The dial process runs the host's binary in the box's pinned user and network namespaces and reads nothing of the box."
boundary = true
checks = ["internal/netpolicy.Pin", "internal/netpolicy.Forwarder.DialArgs"]
concerns = ["forwards-and-local-urls"]

[[channel]]
id = "daemon-dialer"
from = "daemon"
to = "dialer"
title = "Router dial"
transport = "`nsenter --user=/proc/self/fd/3 --net=/proc/self/fd/4 --preserve-credentials <devc> box dial 127.0.0.1:<port>`, one end of a socket pair as standard input and output."
carries = "One connection of the router to a box port."
concerns = ["forwards-and-local-urls"]

[[channel]]
id = "cli-dialer"
from = "cli"
to = "dialer"
title = "Forward dial"
transport = "The same nsenter command from `devc forward`, with the accepted connection's socket as standard input and output."
carries = "One forwarded connection."
concerns = ["forwards-and-local-urls"]

[[channel]]
id = "cli-github"
from = "cli"
to = "github"
title = "GitHub API (CLI)"
transport = "HTTPS to the REST API with the host's credential as a bearer token."
carries = "`devc pr create`'s new pull request and `devc pr comment`'s comment, also when an approved request runs them."
boundary = true
checks = ["internal/github.Client.Call", "internal/github.Client.checkRedirect"]
concerns = ["github"]

[[channel]]
id = "git-credential"
from = "box-git"
to = "box-tools"
title = "Credential helper"
transport = "git runs `/opt/devc/bin/devc box git-credential get` for the GitHub host (`credential.<scope>.helper` in the box repository) with the URL's description on standard input."
carries = "Protocol and host in; the token of the project's mode out, asked from the daemon each time."
checks = ["internal/boxside.GitCredential"]
concerns = ["github"]

[[channel]]
id = "box-github"
from = "box-git"
to = "github"
title = "git with a token"
transport = "git over HTTPS to the remote `github`, with the box's own network (the network level must let it reach the host)."
carries = "Pushes and fetches of the token modes, authenticated with the token the credential helper printed; GitHub, not devc, decides what the token may do. devc sees nothing of this connection; what limits it is the token: a minted one covers one repository and never `workflows`."
boundary = true
checks = ["internal/github.Minter.Token", "internal/github.CheckPermission"]
concerns = ["github"]

[[channel]]
id = "daemon-service"
from = "daemon"
to = "service-upstream"
title = "Service upstream"
transport = "HTTPS (plain HTTP only with `allow_insecure`) from the daemon with the host's trust store, never through a proxy, HTTP/2 where offered, no redirects followed."
carries = "A box's request that a rule allows, with the box's credential headers removed and the service's credential added; the response, filtered before it reaches the box."
boundary = true
checks = ["internal/svclogin.modifyResponse", "internal/svclogin.scrubber.header"]
concerns = ["service-logins"]

[[channel]]
id = "podman-login"
from = "podman"
to = "service-login"
title = "Login run"
transport = "`podman run --rm --cap-drop=ALL` with no new privileges and the toolbox's seccomp profile, the network on, a scratch directory at /login, no standard input, five minutes."
carries = "The login command, the service directory's other files and the login secrets as files; the cookies as JSON on standard output."
boundary = true
checks = ["internal/svclogin.ParseLoginOutput"]
concerns = ["service-logins"]

[[channel]]
id = "login-upstream"
from = "service-login"
to = "service-upstream"
title = "Login"
transport = "Whatever the login command does, usually HTTPS form posts with curl."
carries = "The login secrets, to the service's login page; its session cookies back, which become a jar only after a strict check of the login's output."
boundary = true
checks = ["internal/svclogin.ParseLoginOutput"]
concerns = ["service-logins"]

[[channel]]
id = "podman-desktop"
from = "podman"
to = "desktop"
title = "Desktop run"
transport = "`podman create` that joins the box's network and user namespaces, without capabilities, with a read-only root and one tmpfs; `podman exec` of `devc-desktop secrets` and `ready`."
carries = "The X cookie and the VNC password, as a tar archive on standard input; whether the display's services own their sockets."
concerns = ["desktop"]

[[channel]]
id = "box-display"
from = "box-program"
to = "desktop"
title = "Display"
transport = "TCP on the loopback interface the box and the sidecar share: X11 on 127.0.0.1:6001, VNC on 5901, the viewer on 6080."
carries = "X clients' drawing and the display's contents and input; the cookie in /run/devc/display.xauth admits an X client."
boundary = true
checks = ["internal/gui.NewSecrets"]
concerns = ["desktop"]

[[channel]]
id = "dialer-desktop"
from = "dialer"
to = "desktop"
title = "Viewer"
transport = "TCP to 127.0.0.1:6080 in the box's network namespace, from the dial process of the viewer's forward."
carries = "noVNC's page and its WebSocket to the VNC server, which asks for the password."
boundary = true
checks = ["internal/netpolicy.Pin", "internal/gui.NewSecrets"]
concerns = ["desktop"]

[[channel]]
id = "archive-upload"
from = "daemon"
to = "hub"
title = "Archive uploads"
transport = "HTTPS with the machine certificate, on the uploader's own connections and never the machine link: `PUT /machine/archive/<realm>/<path>?offset=…`, and the index and prefix hashes of the machine's own archive."
carries = "Appends to this machine's archive at the stored length: file generations with class, mode and completion, bundle parts, ref log lines."
boundary = true
checks = ["internal/hub.Server.apiArchivePut", "internal/archive.ParsePath", "internal/hub.archiveStore.admit", "internal/hub.archiveStore.putFile", "internal/hub.archiveStore.checkQuota"]
concerns = ["fleet-archive"]

[[channel]]
id = "cli-hub-archive"
from = "cli"
to = "hub"
title = "Restores, secrets"
transport = "HTTPS with the machine certificate, from `devc state pull` and `devc secret push|pull`."
carries = "Index pages, files and bundles of any machine's archive; encrypted secrets bundles in both directions."
boundary = true
checks = ["internal/fleet.Client.Index", "internal/archive.ParsePath", "internal/archive.DecodeSealed", "internal/hub.Server.apiSecretsPut"]
concerns = ["state-restore", "secret-transfer"]

[[channel]]
id = "hub-archive-write"
from = "hub"
to = "hub-archive"
title = "Archive files"
transport = "Files below the hub directory: appended with `O_APPEND` and synced, created exclusively without following links, records replaced by a rename, directory entries synced."
carries = "File generations and their records, bundle parts made final by a rename that replaces nothing, ref log lines, secrets bundles; what retention removes."
concerns = ["fleet-archive", "secret-transfer"]
