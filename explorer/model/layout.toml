# State on disk: the top two levels of the configuration, state and
# runtime directories (internal/paths knows them all), and the mounts of a
# box. "<name>" marks a part that varies.

[[tree]]
id = "config"
title = "Configuration directory"
root = "~/.config/devc"
summary = "Policy, written by the user. `DEVC_CONFIG_DIR` or `--config-dir` move it. No box can write it, and devc reads policy from nowhere else."

[[tree.entry]]
path = "config.toml"
text = "The machine's settings ([[surface:config-global]])."
writer = "user"
ref = "internal/paths.Paths.ConfigFile"

[[tree.entry]]
path = "realms/<realm>"
text = "A realm: `realm.toml`, an optional `instructions.md` for its boxes, `projects/<project>/project.toml` and `services/<name>/service.toml`."
writer = "user"
ref = "internal/paths.Paths.RealmDir"

[[tree.entry]]
path = "realms/<realm>/realm.toml"
text = "The realm's settings ([[surface:config-realm]]); required, may be empty. `devc realm add` writes a new one at the user's command."
writer = "user"
ref = "internal/paths.Paths.RealmFile"

[[tree.entry]]
path = "realms/<realm>/instructions.md"
text = "Added to the instructions of every harness in the realm's boxes."
writer = "user"
ref = "internal/paths.Paths.RealmInstructions"

[[tree.entry]]
path = "realms/<realm>/projects/<project>/project.toml"
text = "A project's settings ([[surface:config-project]]); required, may be empty. `devc project add` and `adopt` write a new one at the user's command, never over an existing one."
writer = "user"
ref = "internal/paths.Paths.ProjectFile"

[[tree.entry]]
path = "realms/<realm>/services/<name>/service.toml"
text = "A service boxes of the realm reach through the daemon ([[surface:config-service]]); the directory also holds the files its login needs."
writer = "user"
ref = "internal/paths.Paths.ServiceFile"

[[tree.entry]]
path = "envs/<env>"
text = "An image recipe: a Containerfile and/or `env.toml`. The directory is the build context of the env's image."
writer = "user"
ref = "internal/paths.Paths.EnvDir"

[[tree.entry]]
path = "envs/<env>/Containerfile"
text = "Built into `localhost/devc-env/<env>:latest`."
writer = "user"
ref = "internal/paths.Paths.EnvContainerfile"

[[tree.entry]]
path = "envs/<env>/env.toml"
text = "A description, a base image (for an env without a Containerfile) and build arguments ([[surface:config-env]])."
writer = "user"
ref = "internal/paths.Paths.EnvFile"

[[tree.entry]]
path = "envs/<env>/root-log.jsonl"
text = "`devc root` appends each command it ran in a box of this env, one JSON object per line, rather than editing the recipe. The only file devc writes in this directory on its own."
writer = "host"
ref = "internal/paths.Paths.EnvRootLog"

[[tree.entry]]
path = "harness/<id>.toml"
text = "The user's harness manifests; one with the id of a built-in manifest replaces it."
writer = "user"
ref = "internal/paths.Paths.UserHarnessFile"

[[tree.entry]]
path = "baseline/<harness>"
text = "The user's baseline for a harness: `settings.json` or `settings.toml`, under the keys devc requires, and `instructions.md`."
writer = "user"
ref = "internal/paths.Paths.BaselineDir"

[[tree.entry]]
path = "baseline/instructions.md"
text = "Added to the instructions of every harness in every box."
writer = "user"
ref = "internal/paths.Paths.BaselineInstructions"

[[tree.entry]]
path = "dotfiles"
text = "Dotfiles for box homes: the host copies them into what it renders for /etc/devc, and box init links them into /home/dev."
writer = "user"
ref = "internal/paths.Paths.DotfilesDir"

[[tree]]
id = "state"
title = "State directory"
root = "~/.local/share/devc"
summary = "What devc keeps: durable state that must survive and is archived to hubs, local state of this machine, the toolbox and caches. `DEVC_STATE_DIR`, `--state-dir` or `state_dir` in config.toml move it."

[[tree.entry]]
path = "durable/realms/<realm>"
text = "A realm's durable state: relays, journals, secrets, request logs, the context repository, shared harness state and more. Shared harness state and the context's notes and memory are mounted into boxes and so box-writable; the rest no box reaches."
writer = "both"
ref = "internal/paths.Paths.DurableRealmDir"

[[tree.entry]]
path = "durable/realms/<realm>/harness/<harness>"
text = "The realm's shared harness state: subdirectories of a private home (`home.shared`), or with strategy `shared` the whole home (`home/`) and further directories (`also/<dir>`). Mounted into the realm's boxes, so box-writable; a `shared-home` login writes the credential here."
writer = "both"
ref = "internal/paths.Paths.HarnessStateDir"

[[tree.entry]]
path = "durable/realms/<realm>/context"
text = "The realm's context tree: `notes/<project>` and `memory/<group>`, which boxes write, and `data/<project>/manifest.jsonl`, which no box mounts. The context repository versions it."
writer = "both"
ref = "internal/paths.Paths.ContextDir"

[[tree.entry]]
path = "durable/realms/<realm>/context/.git"
text = "The context repository: a bare repository with the branch `main`, written only by the context worker in a container without network (`devc box context-worker`); no box mounts it, since boxes mount only `notes/<project>` and `memory/<group>`."
writer = "host"
ref = "internal/ctxrepo.Repo"

[[tree.entry]]
path = "durable/realms/<realm>/context/notes/<project>"
text = "A project's notes, mounted at /ctx/notes."
writer = "both"
ref = "internal/paths.Paths.NotesDir"

[[tree.entry]]
path = "durable/realms/<realm>/context/memory/<group>"
text = "The memory of a memory group, mounted at /ctx/memory."
writer = "both"
ref = "internal/paths.Paths.MemoryDir"

[[tree.entry]]
path = "durable/realms/<realm>/context/data/<project>/manifest.jsonl"
text = "A project's data manifest; written by the host only, through safefs, because the rest of the context tree is box-written."
writer = "host"
ref = "internal/paths.Paths.ManifestFile"

[[tree.entry]]
path = "durable/realms/<realm>/relay/<project>.git"
text = "The project's relay, a bare repository the box reaches only through the daemon's relay service."
writer = "host"
ref = "internal/paths.Paths.RelayRepo"

[[tree.entry]]
path = "durable/realms/<realm>/journal/<project>/<session>.jsonl"
text = "A session's journal: validated events with the host's sequence numbers and times."
writer = "host"
ref = "internal/paths.Paths.JournalFile"

[[tree.entry]]
path = "durable/realms/<realm>/secrets/<name>"
text = "A realm secret, mode 0600 in a 0700 directory: harness tokens stored by `devc login`, secrets set with `devc secret set`."
writer = "host"
ref = "internal/paths.Paths.SecretsDir"

[[tree.entry]]
path = "durable/realms/<realm>/secrets/github-token"
text = "The host's own GitHub credential (or `gh auth token` instead): read by the daemon's read facade and by `devc pr`, never handed to a box by them."
writer = "host"
ref = "internal/github.HostTokenSecret"

[[tree.entry]]
path = "durable/realms/<realm>/secrets/_jar.<service>"
text = "A cookie service's jar, written by `devc service login` with the time of the login and read by the daemon's service proxy; no project may grant it."
writer = "host"
ref = "internal/config.JarSecret"

[[tree.entry]]
path = "durable/realms/<realm>/requests/<project>.jsonl"
text = "The project's request log: one line per change of a request, compacted past 4 MiB; only the daemon writes it."
writer = "host"
ref = "internal/paths.Paths.RequestsFile"

[[tree.entry]]
path = "durable/realms/<realm>/netlog/<project>.jsonl"
text = "The allowlist proxy's log of a project: every decision, refusals and closings included (0600). Past 4 MiB it moves to `<project>.jsonl.1`, replacing the previous one."
writer = "host"
ref = "internal/paths.Paths.NetLogFile"

[[tree.entry]]
path = "durable/realms/<realm>/gate-log.jsonl"
text = "One line per SSH gate session of the realm's boxes, run or refused, with the command up to 4 KiB (0600, appended under a lock). Never rotated."
writer = "host"
ref = "internal/paths.Paths.GateLog"

[[tree.entry]]
path = "durable/realms/<realm>/savepoints/<project>.jsonl"
text = "The index of a project's savepoints."
writer = "host"
ref = "internal/paths.Paths.SavepointIndex"

[[tree.entry]]
path = "durable/realms/<realm>/service-log/<name>.jsonl"
text = "The requests boxes made to a service: time, box, method, path and status, never headers or bodies."
writer = "host"
ref = "internal/paths.Paths.ServiceLogFile"

[[tree.entry]]
path = "durable/session-owners"
text = "One file per session ID naming the project whose journal first recorded it, so a box cannot claim another project's session."
writer = "host"
ref = "internal/paths.Paths.SessionOwnersDir"

[[tree.entry]]
path = "durable/node"
text = "This machine's identity towards hubs: `hubs/<id>/` holds the client certificate and key of each hub it joined."
writer = "host"
ref = "internal/paths.Paths.NodeDir"

[[tree.entry]]
path = "durable/node/hubs/<hub-id>"
text = "The credentials for one hub; the ID is 16 hex characters derived from the hub's URL."
writer = "host"
ref = "internal/paths.Paths.NodeHubDir"

[[tree.entry]]
path = "durable/node/hubs/<hub-id>/key.pem"
text = "The machine's private key for this hub, 0600 in a 0700 directory: made here by `devc join --token`, or copied from `devc hub ca issue machine`. Beside it `cert.pem` (the machine certificate), `ca.pem` (the CA of the hub's server certificate, when `--ca` was given) and `hub.json` (the hub's URL and when it was joined), all written atomically by `devc join`."
writer = "host"
ref = "internal/hubnode.Save"

[[tree.entry]]
path = "durable/shares"
text = "Published shares, one directory per share with its versions; mounted read-only into the boxes that list them. `durable/share-log/` records their sources."
writer = "host"
ref = "internal/paths.Paths.SharesDir"

[[tree.entry]]
path = "durable/shares/<name>"
text = "One share: its versions and the `current` link."
writer = "host"
ref = "internal/paths.Paths.ShareDir"

[[tree.entry]]
path = "durable/shares/.staging"
text = "Where a version is extracted before it is renamed into place; never mounted."
writer = "host"
ref = "internal/paths.Paths.ShareStagingDir"

[[tree.entry]]
path = "durable/share-log/<name>.jsonl"
text = "The published versions of a share with their sources, kept apart from the share, which boxes of other realms see."
writer = "host"
ref = "internal/paths.Paths.ShareLogFile"

[[tree.entry]]
path = "local/boxes/<realm>/<project>"
text = "A box's files on this machine: its home (mounted at /home/dev, box-writable), what is rendered for /etc/devc, baselines, the capability record, network exceptions, the box lock."
writer = "both"
ref = "internal/paths.Paths.BoxLocalDir"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/home"
text = "The box user's home, mounted at /home/dev."
writer = "both"
ref = "internal/paths.Paths.BoxHomeDir"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/etc"
text = "Rendered for the box and mounted read-only at /etc/devc: `box.json`, the tmux configuration, the dotfiles, `harness/<id>.json` launch descriptions with their seeds, at level internet the network binding `netns.json`, the gate's `ssh_config` and `gate_known_hosts`, and `display.env` while a desktop runs."
writer = "host"
ref = "internal/paths.Paths.BoxEtcDir"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/baseline/<harness>"
text = "A harness's rendered settings and instructions, mounted read-only at the manifest's baseline directory."
writer = "host"
ref = "internal/paths.Paths.BoxBaselineDir"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/harness/<harness>"
text = "The per-box subdirectories (`home.per_box`) of a harness whose home the realm shares; box-writable."
writer = "both"
ref = "internal/paths.Paths.BoxHarnessDir"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/shares"
text = "Rendered for the box's /opt/shares: one link per share."
writer = "host"
ref = "internal/paths.Paths.BoxSharesDir"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/lock"
text = "Serialises the lifecycle operations of one box across devc processes; beside the home, so no box reaches it."
writer = "host"
ref = "internal/paths.Paths.BoxLockFile"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/capabilities.json"
text = "What the box's last successful start was given: its container ID, secrets, SSH grants, network level and allowlist, GitHub grant and services. Written at the end of a successful start, removed at the beginning of the next and whenever the box stops; grants on demand are checked against it."
writer = "host"
ref = "internal/paths.Paths.BoxCapabilitiesFile"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/net-exceptions.json"
text = "The network exceptions granted to the project's box (0600, at most 256, expired ones dropped at each write), kept across down and up; `devc rm` removes it. Only `devc net allow` and `revoke` write it."
writer = "host"
ref = "internal/paths.Paths.BoxNetExceptionsFile"

[[tree.entry]]
path = "local/receipts"
text = "The daemon's command receipts (directory 0700): one file per command ID, created exclusively before the command acts, kept seven days after it is final."
writer = "host"
ref = "internal/paths.Paths.ReceiptsDir"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/spool-offsets.json"
text = "How far ingestion got in each of the box's spool files, and the files refused because their session belongs to another project."
writer = "host"
ref = "internal/session.Store.offsetsFile"

[[tree.entry]]
path = "local/boxes/<realm>/<project>/ingest.lock"
text = "Serialises ingestion of one box between the daemon and CLI commands, so seq numbers are never assigned twice; separate from the box lock, which `up` can hold for minutes."
writer = "host"
ref = "internal/session.Store.Lock"

[[tree.entry]]
path = "local/archive"
text = "The daemon's bookkeeping of the hub archive: per hub, the upload state and the bundles waiting to be uploaded."
writer = "host"
ref = "internal/paths.Paths.ArchiveDir"

[[tree.entry]]
path = "local/archive/<hub-id>"
text = "The upload state of one hub and the bundles waiting for it."
writer = "host"
ref = "internal/paths.Paths.ArchiveHubDir"

[[tree.entry]]
path = "local/gate"
text = "The SSH gate's host key and the public keys of boxes, with the lock under which the host key is made."
writer = "host"
ref = "internal/paths.Paths.GateDir"

[[tree.entry]]
path = "local/gate/host_ed25519"
text = "The private host key of the gate's sshd; `host_ed25519.pub` beside it."
writer = "host"
ref = "internal/paths.Paths.GateHostKey"

[[tree.entry]]
path = "local/gate/keys/<box-id>.pub"
text = "A box's public key with the options `restrict,pty`; the private key exists only in the box's secrets directory."
writer = "host"
ref = "internal/paths.Paths.GateBoxKey"

[[tree.entry]]
path = "local/git"
text = "The empty hooks directory host git uses, and the relay hooks (links to devc)."
writer = "host"
ref = "internal/paths.Paths.RelayHooksDir"

[[tree.entry]]
path = "local/git/no-hooks"
text = "An empty directory, every host git command's `core.hooksPath`, so no hook runs on the host."
writer = "host"
ref = "internal/paths.Paths.NoHooksDir"

[[tree.entry]]
path = "local/git/relay-hooks"
text = "Links to devc named pre-receive, update and post-receive, used only by the receive-pack the daemon runs for a box's push."
writer = "host"
ref = "internal/paths.Paths.RelayHooksDir"

[[tree.entry]]
path = "local/tmp"
text = "Short-lived host directories, such as the temporary home of a login container."
writer = "host"
ref = "internal/paths.Paths.TmpDir"

[[tree.entry]]
path = "local/tmp/restore-<random>"
text = "What restic restored for `devc restore`, before a worker copies it into the project; written by restic as the box user, emptied by the rm worker in a helper container (box-written data), then removed."
writer = "host"
ref = "internal/data.Service.resticRestore"

[[tree.entry]]
path = "local/tmp/relay-report-<random>.json"
text = "One push through the relay service: post-receive writes its report here for the daemon, and the hooks keep their notes beside it (`.heads`, the box's branches from pre-receive; `.records`, what each update hook recorded). Created empty (0600) by the daemon, removed when the push is over."
writer = "host"
ref = "internal/daemon.newReportFile"

[[tree.entry]]
path = "local/tmp/service-login-<random>"
text = "The scratch directory of one cookie login (0700): the service directory's other files and `secrets/<NAME>` (0600) for each login secret, mounted at /login in the login container, removed afterwards."
writer = "host"
ref = "internal/svclogin.Login.Run"

[[tree.entry]]
path = "local/context-<realm>.lock"
text = "Serialises the context worker and manifest appends of a realm."
writer = "host"
ref = "internal/paths.Paths.ContextLockFile"

[[tree.entry]]
path = "local/locks/sync/<realm>/<project>/<remote>.lock"
text = "Serialises the data pulls and pushes of a project with one remote; one path component per name, so names with hyphens never share a lock."
writer = "host"
ref = "internal/paths.Paths.SyncLockFile"

[[tree.entry]]
path = "local/services/<realm>/<name>.json"
text = "Whether a cookie service needs a login on this machine; `<name>.lock` beside it serialises logins."
writer = "host"
ref = "internal/paths.Paths.ServiceStateFile"

[[tree.entry]]
path = "local/savepoints"
text = "Restic repositories of savepoints."
writer = "host"
ref = "internal/paths.Paths.SavepointsDir"

[[tree.entry]]
path = "local/savepoints/<realm>/<project>/restic"
text = "The restic repository of a project's savepoints."
writer = "host"
ref = "internal/paths.Paths.ResticRepo"

[[tree.entry]]
path = "local/staging/<realm>/<project>"
text = "Where data pulls land before the helper container moves them into the data directory."
writer = "host"
ref = "internal/paths.Paths.SyncStagingDir"

[[tree.entry]]
path = "toolbox"
text = "The toolbox, mounted read-only at /opt/devc in every box. Everything in it is world-readable."
writer = "host"
ref = "internal/paths.Paths.ToolboxDir"

[[tree.entry]]
path = "toolbox/devc/<build>/devc"
text = "One copy of the devc binary per build (`<version>-<sha256[:12]>`); `devc/current` names the one in use."
writer = "host"
ref = "internal/toolbox.BuildID"

[[tree.entry]]
path = "toolbox/bin"
text = "`devc` and `git-remote-devc` (links to the current build) and `tmux`: the stable entry points, `/opt/devc/bin` in boxes."
writer = "host"
ref = "internal/toolbox.Toolbox.BinDir"

[[tree.entry]]
path = "toolbox/shims/<bin>"
text = "A link to `../bin/devc` per installed harness; started under that name in a box, devc runs the launcher."
writer = "host"
ref = "internal/toolbox.Toolbox.EnsureShim"

[[tree.entry]]
path = "toolbox/helper-rootfs/bin/devc"
text = "The helper container's whole root filesystem: a hard link to (or copy of) the current binary and nothing else."
writer = "host"
ref = "internal/toolbox.Toolbox.HelperRootfs"

[[tree.entry]]
path = "toolbox/seccomp.json"
text = "The box seccomp profile, derived from Podman's default; boxes and auxiliary containers run with it."
writer = "host"
ref = "internal/toolbox.Toolbox.SeccompPath"

[[tree.entry]]
path = "toolbox/harness/<id>/v/<stamp>"
text = "One installation of a harness, named by its UTC time; the installer container's `HOME` is `<stamp>/home`."
writer = "host"
ref = "internal/toolbox.Toolbox.HarnessDir"

[[tree.entry]]
path = "toolbox/harness/<id>/current"
text = "A link to the version new launch descriptions name; `installed.json` describes it and `history.jsonl` records when each version became current."
writer = "host"
ref = "internal/toolbox.Toolbox.ReadInstalled"

[[tree.entry]]
path = "toolbox/tmux/<version>/tmux"
text = "The static tmux, with `tmux/current` and `terminfo/` beside it."
writer = "host"
ref = "internal/toolbox.Toolbox.TmuxDir"

[[tree.entry]]
path = "toolbox/node/<version>"
text = "The pinned Node.js, for harnesses whose manifest needs it."
writer = "host"
ref = "internal/toolbox.Toolbox.NodeDir"

[[tree.entry]]
path = "toolbox/restic/<version>/restic"
text = "The pinned restic of the restic savepoint driver."
writer = "host"
ref = "internal/toolbox.Toolbox.ResticDir"

[[tree.entry]]
path = "toolbox/skills/<name>"
text = "The built-in skills, rewritten at every sync."
writer = "host"
ref = "internal/toolbox.Toolbox.SkillsDir"

[[tree.entry]]
path = "cache/realms/<realm>"
text = "A realm's package cache (mounted at /home/dev/.cache) and dependency sources (mounted at /src), shared by its boxes and box-writable."
writer = "both"
ref = "internal/paths.Paths.RealmSrcCacheDir"

[[tree.entry]]
path = "cache/realms/<realm>/pkg"
text = "The realm's package cache, mounted at /home/dev/.cache."
writer = "both"
ref = "internal/paths.Paths.RealmPkgCacheDir"

[[tree.entry]]
path = "cache/realms/<realm>/src"
text = "Dependency sources fetched by `devc src`, mounted at /src."
writer = "both"
ref = "internal/paths.Paths.RealmSrcCacheDir"

[[tree.entry]]
path = "cache/restic/<realm>/<project>"
text = "restic's cache for a project's savepoint repository."
writer = "host"
ref = "internal/paths.Paths.ResticCache"

[[tree.entry]]
path = "cache/aux/installer"
text = "The build context of the installer image: the Containerfile embedded in devc."
writer = "host"
ref = "internal/toolbox.EnsureAuxImage"

[[tree.entry]]
path = "cache/aux/desktop"
text = "The build context of the desktop image: the Containerfile and the `devc-desktop` script embedded in devc."
writer = "host"
ref = "internal/gui.AuxImage"

[[tree]]
id = "runtime"
title = "Runtime directory"
root = "$XDG_RUNTIME_DIR/devc"
summary = "Sockets and spools, on the runtime tmpfs. `DEVC_RUNTIME_DIR` moves it."

[[tree.entry]]
path = "daemon.sock"
text = "The daemon's API socket (mode 0600, in the 0700 runtime directory)."
writer = "host"
ref = "internal/daemon.SocketPath"

[[tree.entry]]
path = "daemon.lock"
text = "Held by the running daemon; a second daemon for the same runtime directory fails at once."
writer = "host"
ref = "internal/daemon.LockName"

[[tree.entry]]
path = "<box-id>"
text = "A box's runtime directory, mounted at /run/devc and box-writable: `spool/` with the session event files, the readiness marker, the agent's socket and log, the status wrapper's markers. The box ID is the first 12 hex characters of the SHA-256 of `<realm>/<project>`."
writer = "both"
ref = "internal/paths.Paths.BoxRuntimeDir"

[[tree.entry]]
path = "<box-id>/spool"
text = "The session event files the box appends to; the host reads them only through safefs."
writer = "box"
ref = "internal/paths.Paths.SpoolDir"

[[tree.entry]]
path = "<box-id>/ready"
text = "The readiness marker, written by box init by rename once the home is prepared (and, at level internet, the network check passed); devc removes it before every start. Box-writable, so it proves only that init got that far."
writer = "box"
ref = "internal/boxside.writeReady"

[[tree.entry]]
path = "<box-id>/agent.sock"
text = "The agent's socket, which the daemon connects to; the agent accepts only a peer outside the box's PID namespace, and the daemon only a listener in the box's container."
writer = "box"
ref = "internal/boxside.AgentSocket"

[[tree.entry]]
path = "<box-id>/agent.log"
text = "The agent's log, opened without following symlinks and started over at 1 MiB."
writer = "box"
ref = "internal/boxside.OpenAgentLog"

[[tree.entry]]
path = "<box-id>/status/<session>"
text = "Exists while the status wrapper reports the session's state through OSC 7501; the hook receiver then drops its own state events."
writer = "box"
ref = "internal/boxside.StatusDir"

[[tree.entry]]
path = "<box-id>/display.xauth"
text = "The desktop's X cookie (0600) while a sidecar runs, at /run/devc/display.xauth in the box: written by the host beneath a directory descriptor under a fresh name and renamed, readable and replaceable by the box."
writer = "host"
ref = "internal/gui.Manager.writeCookie"

[[tree.entry]]
path = "gui/<box-id>.json"
text = "The host's record of a running desktop (0600): container, the box's start, the VNC password, the viewer's forward and port. No box sees it."
writer = "host"
ref = "internal/gui.Record"

[[tree.entry]]
path = "<box-id>-secrets"
text = "The secrets delivered to a box before its start (directory 0700, files 0400), mounted read-only at /run/devc-secrets: a sibling of the runtime directory, not inside it. With `secrets.delivery = \"daemon\"` only the SSH gate's key `gate_key`. Removed when the box stops."
writer = "host"
ref = "internal/paths.Paths.BoxSecretsDir"

[[tree.entry]]
path = "gate"
text = "The SSH master connections of `devc ssh login` and the configuration of running gate sshd processes; never mounted into a box. Box keys are generated here, and only when it is memory-backed (or `DEVC_ALLOW_PERSISTENT_SECRETS=1`)."
writer = "host"
ref = "internal/paths.Paths.GateRuntimeDir"

[[tree.entry]]
path = "gate/m-<hash>.sock"
text = "The control socket of the master connection to one host, named by the first 16 hex characters of the SHA-256 of the alias; through it a client can run sessions and ask for forwards with the user's connection."
writer = "host"
ref = "internal/gate.SocketPath"

[[tree.entry]]
path = "gate/m-<hash>.host"
text = "The alias the socket beside it belongs to, for `devc ssh ls`."
writer = "host"
ref = "internal/gate.HostFile"

[[tree.entry]]
path = "gate/sshd-<box-id>-<random>.conf"
text = "The configuration of one gate sshd (0600), written for one box stream and removed when sshd exits."
writer = "host"
ref = "internal/gate.Server.Prepare"

[[tree.entry]]
path = "forwards/<id>.json"
text = "The record of a running `devc forward` (0600): project, box port, host address and port, the process and, for a foreground forward, its start time. Stale records are removed when listed; the router routes ports that have one."
writer = "host"
ref = "internal/netpolicy.Registry"

[[tree.entry]]
path = "forwards/<id>.log"
text = "The messages of a detached forward."
writer = "host"
ref = "internal/netpolicy.Registry.LogFile"

# ----- the mounts of a box (internal/box.BuildSpec, plus what the
# harness, data and shares contributors add)

[[mount]]
source = "<projects root>/<realm>/<project>"
target = "/w/<realm>/<project>"
mode = "rw"
text = "The project directory: the box repository (`.repo`), the worktrees `main/` and its siblings, and the data directory. Box-writable; host code never runs tools in it or walks it."
ref = "internal/paths.Paths.HostProjectDir"

[[mount]]
source = "<projects root>/<realm>/<other project>"
target = "/w/<realm>/<other project>"
mode = "ro (rw if the mount says so)"
text = "Another project of the same realm, for each `[[mounts]]` entry of project.toml."
ref = "internal/config.Mount"

[[mount]]
source = "<state>/local/boxes/<realm>/<project>/home"
target = "/home/dev"
mode = "rw"
text = "The box user's home."
ref = "internal/paths.Paths.BoxHomeDir"

[[mount]]
source = "<state>/cache/realms/<realm>/pkg"
target = "/home/dev/.cache"
mode = "rw"
text = "The realm's package cache, shared by its boxes."
ref = "internal/paths.Paths.RealmPkgCacheDir"

[[mount]]
source = "<state>/cache/realms/<realm>/src"
target = "/src"
mode = "rw"
text = "Dependency sources fetched by `devc src`, shared by the realm's boxes."
ref = "internal/paths.Paths.RealmSrcCacheDir"

[[mount]]
source = "<state>/durable/realms/<realm>/context/notes/<project>"
target = "/ctx/notes"
mode = "rw"
text = "The project's notes in the realm's context repository."
ref = "internal/paths.Paths.NotesDir"

[[mount]]
source = "<state>/durable/realms/<realm>/context/memory/<group>"
target = "/ctx/memory"
mode = "rw"
text = "The memory of the project's memory group."
ref = "internal/paths.Paths.MemoryDir"

[[mount]]
source = "<state>/toolbox"
target = "/opt/devc"
mode = "ro"
text = "The toolbox: devc itself, tmux, harness installations and shims, skills."
ref = "internal/paths.Paths.ToolboxDir"

[[mount]]
source = "<state>/local/boxes/<realm>/<project>/etc"
target = "/etc/devc"
mode = "ro"
text = "What the host renders for the box: its description (`box.json`), launch descriptions of harnesses, the tmux configuration, the dotfiles, SSH configuration for the gate."
ref = "internal/paths.Paths.BoxEtcDir"

[[mount]]
source = "<runtime>/<box-id>"
target = "/run/devc"
mode = "rw"
text = "The box's runtime directory: the spool and the agent's socket."
ref = "internal/paths.Paths.BoxRuntimeDir"

[[mount]]
source = "<state>/local/boxes/<realm>/<project>/baseline/<harness>"
target = "<the manifest's baseline directory>"
mode = "ro"
text = "A harness's rendered settings and instructions, mounted over the image (for Claude Code at /etc/claude-code)."
ref = "internal/harness.BoxHooks.Contribute"

[[mount]]
source = "<state>/durable/realms/<realm>/harness/<harness>/<sub>"
target = "/home/dev/<home.dir>/<sub>"
mode = "rw"
text = "Strategy `private`: each `home.shared` subdirectory comes from realm state (for Claude Code, `projects`, the transcripts)."
ref = "internal/harness.BoxHooks.Contribute"

[[mount]]
source = "<state>/durable/realms/<realm>/harness/<harness>/home"
target = "/home/dev/<home.dir>"
mode = "rw"
text = "Strategy `shared`: the whole harness home is the realm's, credential included; `also/<dir>` is mounted at `/home/dev/<dir>` the same way."
ref = "internal/harness.BoxHooks.Contribute"

[[mount]]
source = "<state>/local/boxes/<realm>/<project>/harness/<harness>/<sub>"
target = "/home/dev/<home.dir>/<sub>"
mode = "rw"
text = "Strategy `shared`: a `home.per_box` subdirectory stays this box's own."
ref = "internal/harness.BoxHooks.Contribute"

[[mount]]
source = "<runtime>/<box-id>-secrets"
target = "/run/devc-secrets"
mode = "ro"
text = "Delivered credentials and granted secrets; always mounted, even when empty."
ref = "internal/harness.BoxHooks.Contribute"

[[mount]]
source = "<state>/local/boxes/<realm>/<project>/shares"
target = "/opt/shares"
mode = "ro"
text = "The shares the project and its realm list."
ref = "internal/shares.BoxHooks.Contribute"

[[mount]]
source = "<state>/durable/shares/<name>"
target = "/opt/shares/.v/<name>"
mode = "ro"
text = "Each share's whole directory, all its versions; the entry `<name>` in /opt/shares leads to the current one."
ref = "internal/shares.BoxHooks.Contribute"

[[mount]]
source = "<state>/local/boxes/<realm>/<project>/etc/ssh_config"
target = "/etc/ssh/ssh_config.d/50-devc.conf"
mode = "ro"
text = "A box with SSH grants: the generated client configuration for the gate, mounted as a single file so the image's ssh reads it."
ref = "internal/gate.BoxHooks.Contribute"

[[mount]]
source = "<projects root>/<realm>/<project>/<data root>/<input zone>"
target = "/w/<realm>/<project>/<data root>/<input zone>"
mode = "ro"
text = "Each input zone of a data project the box mounts, nested read-only over the project mount."
ref = "internal/data.BoxHooks.Contribute"

[[tree]]
id = "projects"
title = "Projects root"
root = "~/devc"
summary = "The project directories, one per project, each mounted read-write into its box at `/w/<realm>/<project>`. `projects_root` in config.toml moves it. Everything here is box-writable: host code never runs git or another tool in it and never walks it."

[[tree.entry]]
path = "<realm>/<project>"
text = "The project directory: the box repository and its worktrees, and the data directory of a data project."
writer = "box"
ref = "internal/paths.Paths.HostProjectDir"

[[tree.entry]]
path = "<realm>/<project>/.repo"
text = "The box repository's git directory (`git init --separate-git-dir`), whose `origin` is `devc::<realm>/<project>`. Snapshots live in it as `refs/devc/wip/<worktree>`; the host reaches it only through `podman exec`."
writer = "box"
ref = "internal/paths.InBoxRepoDir"

[[tree.entry]]
path = "<realm>/<project>/main"
text = "The main worktree, with the default branch checked out by `devc project init`."
writer = "box"
ref = "internal/paths.InBoxWorktree"

[[tree.entry]]
path = "<realm>/<project>/<worktree>"
text = "A task worktree beside main, on the branch `<branch_prefix><worktree>`; `devc wt rm` removes it after banking, and its branch stays."
writer = "box"
ref = "internal/gitx.Service.WorktreeNew"

[[tree.entry]]
path = "<realm>/<project>/<worktree>/data"
text = "The data link `data -> ../<root>` in each worktree of a data project, made in the box by `devc box data-links` unless something is there or git tracks `data`."
writer = "box"
ref = "internal/boxside.Repo.EnsureDataLinks"

[[tree.entry]]
path = "<realm>/<project>/<data root>"
text = "The data root. Owned by the vault, group dev, mode 1770: the box creates entries but cannot rename or remove the vault's; only helper-container workers operate on it for the host."
writer = "box"
ref = "internal/boxside.DataWorker.layoutDirs"

[[tree.entry]]
path = "<realm>/<project>/<data root>/<input zone>"
text = "An input zone: the box user's (0755) on disk, but mounted read-only into the box; written by pulls through the helper container."
writer = "host"
ref = "internal/data.BoxHooks.Contribute"

[[tree.entry]]
path = "<realm>/<project>/<data root>/<work zone>"
text = "A work zone: the vault's with group write (0775), so the box writes anything inside but cannot remove the zone itself. Savepoints are its protection."
writer = "box"
ref = "internal/boxside.DataWorker.layoutDirs"

[[tree.entry]]
path = "<realm>/<project>/<data root>/<sealed zone>/<entry>"
text = "An entry of a sealed zone: the box's until `devc seal` hands it to the vault (directories 0555, files without write bits); the zone is the vault's and sticky (1770), so a sealed entry cannot be moved."
writer = "both"
ref = "internal/boxside.DataWorker.seal"

[[tree.entry]]
path = "<realm>/<project>/.devc"
text = "devc's own directory in a data project: the vault's, mode 0700, so the box can neither enter nor rename it. Written only by the data workers; one the box made is refused."
writer = "host"
ref = "internal/boxside.DataWorker.openDevc"

[[tree.entry]]
path = "<realm>/<project>/.devc/savepoints/<id>"
text = "A reflink savepoint: a read-only, vault-owned copy of the data root without input zones and sealed entries; `.devc/savepoints/.modes/<id>` keeps the original modes."
writer = "host"
ref = "internal/boxside.DataWorker.reflinkSave"

[[tree.entry]]
path = "<realm>/<project>/.devc/trash/<id>"
text = "A trash entry: `payload/<path>` with what rm, a pull or an in-place restore moved there, owners kept, and `meta.json` listing the paths."
writer = "host"
ref = "internal/boxside.DataWorker.newTrashEntry"

[[tree.entry]]
path = "<realm>/<project>/.devc/seals.jsonl"
text = "One line per seal and unseal, with time, counts and the relay's default-branch tip."
writer = "host"
ref = "internal/boxside.SealRecord"

[[tree.entry]]
path = "<realm>/<project>/.devc-staging/push-<stamp>"
text = "A push's staging directory: vault-owned directories (0755, below `.devc-staging` at 0711) of hard links to the files sent; host rsync reads only this. Removed after the push, or by a later push after seven days."
writer = "host"
ref = "internal/boxside.DataWorker.pushStage"

# ----- the hub's directory (X11)

[[tree]]
id = "hub-dir"
title = "Hub directory"
root = "~/.local/share/devc-hub"
summary = "Everything a hub keeps, on the hub's server: `DEVC_HUB_DIR` or `--hub-dir` move it. Made 0700 by `devc hub init`; never mixed with a machine's state directory. The session views in the database can be rebuilt from the machines; the CA, the registry and the password cannot."

[[tree.entry]]
path = "ca/ca.crt"
text = "The hub CA's certificate (ECDSA P-256, ten years). Machines that join with `--ca` and reverse proxies that verify client certificates need a copy."
ref = "internal/hub.Layout.CACert"

[[tree.entry]]
path = "ca/ca.key"
text = "The CA's private key, 0600 in a 0700 directory. Read by `devc hub ca issue`, `devc hub enroll device` and `devc hub init`, and by the server only to sign a machine's certificate request at enrolment."
ref = "internal/hub.Layout.CAKey"

[[tree.entry]]
path = "server/server.key"
text = "The key of the hub's TLS server certificate, 0600; used in direct TLS unless `--tls-key` names another."
ref = "internal/hub.Layout.ServerKey"

[[tree.entry]]
path = "server/server.crt"
text = "A one-year server certificate from the hub CA for the public name, with the CA's certificate after it; the default of direct TLS. Read once, when the server starts."
ref = "internal/hub.Layout.ServerCert"

[[tree.entry]]
path = "server/server.csr"
text = "A certificate request for the same key, for a public CA."
ref = "internal/hub.Layout.ServerCSR"

[[tree.entry]]
path = "hub.db"
text = "The SQLite database (with `hub.db-wal` and `hub.db-shm`), 0600: the certificate registry, machines, session views with cursors, event tails, pending requests, the change log, the user's password hash and TOTP secret, login sessions, failed logins, enrolment tokens (with a device's encrypted bundle until it is downloaded), action tokens, notification records. Tokens are stored as their SHA-256."
ref = "internal/hub.Layout.DB"

[[tree.entry]]
path = "hub.toml"
text = "The hub's settings, written by the user: the public URL, ntfy server, topic and token, whether terminals may be controlled, the archive's limits. Decoded strictly; the server warns when others can read it."
writer = "user"
ref = "internal/hub.Layout.ConfigFile"
